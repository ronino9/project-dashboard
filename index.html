<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Real-time Control Tower - Project 7</title>
  <style>
    /* Slate Dark Mode UI */
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #0f172a; color: #f8fafc; }
    .container { max-width: 1400px; margin: 0 auto; padding: 16px; }
    .header { background: #1e293b; border: 1px solid #334155; border-radius: 8px; padding: 24px; margin-bottom: 12px; }
    .header-top { display: flex; gap: 20px; flex-wrap: wrap; align-items: center; }
    .project-basic { flex: 0 0 auto; min-width: 150px; }
    .project-no { font-size: 28px; font-weight: 700; color: #f8fafc; margin-bottom: 4px; }
    .donuts-row { display: flex; gap: 20px; flex: 1; justify-content: space-around; min-width: 400px; }
    
    /* Progress Bar */
    .progress-section { margin-top: 24px; padding-top: 16px; border-top: 1px solid #334155; }
    .progress-bar { height: 16px; background: #334155; border-radius: 8px; overflow: hidden; margin: 8px 0; }
    .progress-fill { height: 100%; background: linear-gradient(90deg, #34d399, #3b82f6); width: 0%; transition: width 1.5s cubic-bezier(0.1, 0, 0.2, 1); }
    
    /* Donut & Details Styling */
    .donut-box { text-align: center; flex: 1; display: flex; flex-direction: column; align-items: center; }
    .donut-label { font-size: 13px; font-weight: 600; color: #94a3b8; margin-bottom: 10px; }
    .donut-status { font-size: 14px; font-weight: 700; margin-top: 12px; margin-bottom: 16px; }
    .loading { opacity: 0.5; font-size: 14px; text-align: center; padding: 20px; width: 100%; }
    
    /* 하단 상세 텍스트 테이블 영역 */
    .donut-details { width: 100%; max-width: 180px; font-size: 12px; }
    .detail-row { display: flex; justify-content: space-between; margin-bottom: 6px; }
    .detail-label { color: #94a3b8; }
    .detail-val { color: #e2e8f0; font-weight: 500; font-family: monospace; font-size: 13px;}
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <div class="header-top">
        <div class="project-basic">
          <div class="project-no">Project 7</div>
          <div style="font-size: 12px; color: #64748b;">No.7_DB1 Real-time Sync</div>
        </div>
        <div class="donuts-row" id="donuts">
          <div class="loading">시트 데이터를 가져오는 중...</div>
        </div>
      </div>

      <div class="progress-section">
        <div style="display:flex; justify-content:space-between; align-items:center;">
          <span style="font-size:14px; color:#94a3b8; font-weight:600;">Overall Project Progress</span>
          <span style="font-size:18px; font-weight:700; color:#3b82f6;" id="progressText">0%</span>
        </div>
        <div class="progress-bar">
          <div class="progress-fill" id="progressFill"></div>
        </div>
      </div>
    </div>
  </div>

  <script>
    // 최신 API URL 적용
    const API_URL = 'https://script.google.com/macros/s/AKfycbwygv0To3Dckq9-mV0UEM63N3Y3DMfB1fd7dwrcqMDGpWiDsjlsMuQDoa2Dvk06fw8Tag/exec';

    // 날짜 포맷 정리 함수 (2026.01.26 -> 26.01.26)
    function formatDate(dateStr) {
      if(dateStr && dateStr.length === 10 && dateStr.startsWith('20')) {
        return dateStr.substring(2);
      }
      return dateStr || '-';
    }

    // 1. 대시보드를 화면에 그리는 핵심 함수
    function renderDashboard(data) {
      const labels = ['제작', 'FAT', 'SET-UP', 'SAT'];
      
      const donutHTML = labels.map((label, i) => {
        // 도넛 퍼센트 및 상태 계산
        const comp = data.complete[i] || 0;
        const incomp = data.incomplete[i] || 0;
        const total = comp + incomp;
        const percent = total === 0 ? 0 : Math.round((comp / total) * 100);
        
        const statusText = data.status[i] || 'Waiting';
        const dashArray = `${percent}, 100`;
        
        let themeColor = '#fbbf24'; // 금색 (기본값)
        const statusLower = statusText.toLowerCase();
        if (statusLower.includes('completed')) {
          themeColor = '#34d399'; // 녹색
        } else if (statusLower.includes('progress')) {
          themeColor = '#3b82f6'; // 파란색
        }

        const circleColor = percent === 0 ? '#334155' : themeColor;

        // 하단 상세 데이터 (13~16행)
        const rowData = data.details[i] || []; 
        const rateStr = rowData[5] || '0%'; 
        
        // 100% 초과 시 빨간색 처리
        const rateNum = parseFloat(rateStr.replace(/[^0-9.-]/g, '')) || 0;
        const isOverLimit = rateNum > 100;
        const rateColor = isOverLimit ? '#ef4444' : '#e2e8f0'; 
        const rateFontW = isOverLimit ? '700' : '500';

        let detailsHTML = '';
        
        if (i === 0) {
          // [제작] 파트
          const startD = formatDate(rowData[0]); 
          const endD = formatDate(rowData[2]);   
          detailsHTML = `
            <div class="donut-details">
              <div class="detail-row"><span class="detail-label">시작일</span><span class="detail-val">${startD}</span></div>
              <div class="detail-row"><span class="detail-label">완료일</span><span class="detail-val">${endD}</span></div>
              <div class="detail-row"><span class="detail-label">기한 대비율(%)</span><span class="detail-val" style="color:${rateColor}; font-weight:${rateFontW};">${rateStr}</span></div>
            </div>
          `;
        } else {
          // [FAT, SET-UP, SAT] 파트
          const planMD = rowData[1] || '0.0'; 
          const usedMD = rowData[2] || '0.0'; 
          const displayPlan = planMD === '0' || planMD === '' ? '0.0' : planMD;
          const displayUsed = usedMD === '0' || usedMD === '' ? '0.0' : usedMD;

          detailsHTML = `
            <div class="donut-details">
              <div class="detail-row"><span class="detail-label">계획 공수(MD)</span><span class="detail-val">${displayPlan}</span></div>
              <div class="detail-row"><span class="detail-label">소요 공수(MD)</span><span class="detail-val">${displayUsed}</span></div>
              <div class="detail-row"><span class="detail-label">소진율(%)</span><span class="detail-val" style="color:${rateColor}; font-weight:${rateFontW};">${rateStr}</span></div>
            </div>
          `;
        }

        return `
          <div class="donut-box">
            <div class="donut-label">${label}</div>
            <div style="position: relative; width: 90px; height: 90px; margin: 0 auto;">
              <svg viewBox="0 0 36 36" style="width: 100%; height: 100%;">
                <path d="M18 2.0845 a 15.9155 15.9155 0 0 1 0 31.831 a 15.9155 15.9155 0 0 1 0 -31.831" fill="none" stroke="#0f172a" stroke-width="3"/>
                <path d="M18 2.0845 a 15.9155 15.9155 0 0 1 0 31.831 a 15.9155 15.9155 0 0 1 0 -31.831" fill="none" stroke="${circleColor}" stroke-width="3.5" stroke-dasharray="${dashArray}" style="stroke-linecap: round; transition: all 1s;"/>
              </svg>
              <div style="position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); font-size: 19px; font-weight: 700; color: ${themeColor};">${percent}%</div>
            </div>
            <div class="donut-status" style="color:${themeColor}">${statusText}</div>
            ${detailsHTML}
          </div>
        `;
      }).join(''); 

      document.getElementById('donuts').innerHTML = donutHTML;

      // 전체 진행률 업데이트
      const overallPercent = data.overall || '0%'; 
      document.getElementById('progressFill').style.width = overallPercent;
      document.getElementById('progressText').textContent = overallPercent;
    }

    // 2. 데이터 연동 (캐싱 + 백그라운드 동기화)
    async function syncDashboard() {
      // (1) 로컬에 저장된 과거 데이터가 있으면 0.1초 만에 즉시 표시
      const cachedData = localStorage.getItem('project7_dashboard_data');
      if (cachedData) {
        renderDashboard(JSON.parse(cachedData));
      }

      // (2) 백그라운드에서 조용히 최신 데이터 요청
      try {
        const response = await fetch(API_URL, { redirect: 'follow' });
        const freshData = await response.json();
        
        // (3) 최신 데이터가 도착하면 로컬 저장소 업데이트 후 화면 새로고침
        localStorage.setItem('project7_dashboard_data', JSON.stringify(freshData));
        renderDashboard(freshData);

      } catch (err) {
        console.error('동기화 실패:', err);
        // 캐시도 없고 통신도 실패했을 때만 에러 메시지 표시
        if (!cachedData) {
          document.getElementById('donuts').innerHTML = '<div style="color:#ef4444; padding:20px;">데이터 연동 에러 (구글 시트 확인 필요)</div>';
        }
      }
    }

    // 화면 로드 시 즉시 실행
    window.addEventListener('load', syncDashboard);
  </script>
</body>
</html>
