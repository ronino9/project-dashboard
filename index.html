<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Project Dashboard - 7</title>
  <style>*{box-sizing:border-box;margin:0;padding:0}body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:#f8f9fa;color:#333}.container{max-width:1400px;margin:0 auto;padding:16px}.header{background:white;border:0.5px solid #e0e0e0;border-radius:8px;padding:16px;margin-bottom:12px}.header-top{display:flex;gap:20px;margin-bottom:16px;flex-wrap:wrap;align-items:flex-start}.project-basic{flex:0 0 auto;min-width:150px}.project-no{font-size:24px;font-weight:600;color:#1a1a1a;margin-bottom:8px}.basic-info{font-size:12px;color:#666;line-height:1.6}.basic-info strong{color:#333;display:block;margin-top:4px}.donuts-row{display:flex;gap:16px;flex-wrap:wrap;flex:1;min-width:300px}.donut-item{flex:0 1 120px;text-align:center}.donut-label{font-size:12px;color:#666;margin-bottom:8px}.donut-svg{width:100%;height:auto;max-width:120px}.donut-status{font-size:11px;font-weight:500;margin-top:6px;color:#1d9e75}.donut-status.waiting{color:#ef9f27}.kpi-panel{flex:0 0 200px;display:flex;flex-direction:column;gap:8px}.kpi-row{display:flex;gap:20px;font-size:12px}.kpi-item{flex:1}.kpi-label{color:#666;font-size:11px;margin-bottom:2px}.kpi-value{font-size:16px;font-weight:600;color:#1a1a1a}.kpi-value.issue{color:#e24b4a}.progress-bar{height:12px;background:#f0f0f0;border-radius:6px;overflow:hidden;margin-top:12px}.progress-fill{height:100%;background:#1d9e75;transition:width 0.3s}.charts-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(400px,1fr));gap:12px;margin-bottom:12px}.chart-card{background:white;border:0.5px solid #e0e0e0;border-radius:8px;padding:16px}.chart-title{font-size:14px;font-weight:600;margin-bottom:12px;color:#1a1a1a}.chart-legend{display:flex;flex-wrap:wrap;gap:12px;margin-bottom:10px;font-size:11px;color:#666}.legend-item{display:flex;align-items:center;gap:4px}.legend-dot{width:8px;height:8px;border-radius:2px}.canvas-wrap{position:relative;height:200px}.table-card{background:white;border:0.5px solid #e0e0e0;border-radius:8px;padding:16px}.filter-row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}.filter-btn{padding:6px 12px;font-size:12px;border:0.5px solid #d0d0d0;background:white;border-radius:4px;cursor:pointer}.filter-btn.active{background:#1d9e75;color:white;border-color:#1d9e75}table{width:100%;border-collapse:collapse;font-size:12px}th{text-align:left;padding:8px;background:#f9f9f9;border-bottom:1px solid #e0e0e0;font-weight:600;color:#666}td{padding:8px;border-bottom:0.5px solid #f0f0f0}tr:hover{background:#fafafa}.badge{display:inline-block;padding:3px 8px;border-radius:3px;font-size:11px;font-weight:500}.badge-complete{background:#e1f5ee;color:#0f6e56}.badge-progress{background:#e6f1fb;color:#185fa5}.badge-hold{background:#faeeda;color:#854f0b}.badge-delay{background:#fcebeb;color:#a32d2d}@media(max-width:768px){.header-top{flex-direction:column}.donuts-row{justify-content:center}.charts-row{grid-template-columns:1fr}.kpi-panel{flex:1}}</style>
</head>
<body>
  <div class="container">
    <div class="header">
      <div class="header-top">
        <div class="project-basic">
          <div class="project-no">Project 7</div>
          <div class="basic-info"><div><strong>발주처</strong></div><div style="margin-top:4px;"><strong>납품처</strong></div><div style="margin-top:4px;">Start: 2026.01.26</div></div>
        </div>
        <div class="donuts-row" id="donuts"></div>
        <div class="kpi-panel" id="kpi"></div>
      </div>
      <div style="margin-top:12px;"><div style="display:flex;align-items:center;gap:10px;margin-bottom:4px;"><span style="font-size:12px;color:#666;">Overall Progress</span><div class="progress-bar" style="flex:1;margin:0;"><div class="progress-fill" id="progressFill" style="width:48%"></div></div><span style="font-size:12px;font-weight:600;color:#1d9e75;" id="progressText">48%</span></div></div>
    </div>
    <div class="charts-row">
      <div class="chart-card"><div class="chart-title">공수 집계</div><div class="chart-legend"><div class="legend-item"><div class="legend-dot" style="background:#ef9f27;"></div>기술지원</div><div class="legend-item"><div class="legend-dot" style="background:#e24b4a;"></div>Issue</div><div class="legend-item"><div class="legend-dot" style="background:#1d9e75;"></div>개선</div><div class="legend-item"><div class="legend-dot" style="background:#b4b2a9;"></div>표준</div></div><div class="canvas-wrap"><canvas id="chartMD" style="max-height:200px;"></canvas></div></div>
      <div class="chart-card"><div class="chart-title">진행 현황 (건수)</div><div class="chart-legend"><div class="legend-item"><div class="legend-dot" style="background:#e24b4a;"></div>지연중</div><div class="legend-item"><div class="legend-dot" style="background:#ef9f27;"></div>임박</div><div class="legend-item"><div class="legend-dot" style="background:#b4b2a9;"></div>보류</div><div class="legend-item"><div class="legend-dot" style="background:#9fe1cb;"></div>지연완료</div><div class="legend-item"><div class="legend-dot" style="background:#1d9e75;"></div>완료</div></div><div class="canvas-wrap"><canvas id="chartCnt" style="max-height:200px;"></canvas></div></div>
    </div>
    <div class="table-card"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;flex-wrap:wrap;gap:8px;"><div class="chart-title" style="margin:0;">이력 사항</div><div class="filter-row" style="margin:0;" id="filters"></div></div><table><thead><tr id="tableHeaders"></tr></thead><tbody id="dataBody"></tbody></table><div style="font-size:12px;color:#999;margin-top:12px;padding-top:12px;border-top:0.5px solid #f0f0f0;" id="rowCount"></div></div>
  </div>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
  <script>
    const API_URL = 'https://script.google.com/macros/s/AKfycbwXW_0D-5nNpgvwx1wYNYWwb5BzaZ3mcKsI1QTo-caflH6YllnClD8yOvF4sZmKnI_vQg/exec';
    let allData = [];
    let filterVal = '전체';
    
    async function loadData() {
      try {
        const response = await fetch(API_URL);
        const result = await response.json();
        allData = result.rows;
        renderTable();
        console.log('데이터 로드 완료:', result);
      } catch (error) {
        console.error('데이터 로드 실패:', error);
      }
    }
    
    function renderTable() {
      const tbody = document.getElementById('dataBody');
      const headers = document.getElementById('tableHeaders');
      
      if (allData.length === 0) return;
      
      // 헤더 설정
      if (headers.children.length === 0) {
        const headerCells = ['#', '진행상태', '항목/내용', '단계', '대응구분', '파트', '완료예정일', '공수(MD)'];
        headerCells.forEach(h => {
          const th = document.createElement('th');
          th.textContent = h;
          headers.appendChild(th);
        });
      }
      
      // 데이터 채우기
      tbody.innerHTML = allData.map((row, idx) => {
        return `<tr>
          <td>${idx + 1}</td>
          <td>${row[1] || ''}</td>
          <td style="max-width:200px;overflow:hidden;text-overflow:ellipsis;">${row[2] || ''}</td>
          <td>${row[4] || ''}</td>
          <td>${row[5] || ''}</td>
          <td>${row[7] || ''}</td>
          <td>${row[10] || ''}</td>
          <td>${row[12] || ''}</td>
        </tr>`;
      }).join('');
      
      document.getElementById('rowCount').textContent = `총 ${allData.length}개 항목`;
    }
    
    window.addEventListener('load', loadData);
  </script>
</body>
</html>
