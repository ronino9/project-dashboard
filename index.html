<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Real-time Control Tower - Project 7</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    /* 기존 스타일 유지 */
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #0f172a; color: #f8fafc; }
    .container { max-width: 1400px; margin: 0 auto; padding: 16px; }
    .header { background: #1e293b; border: 1px solid #334155; border-radius: 8px; padding: 24px; margin-bottom: 16px; }
    .header-top { display: flex; gap: 20px; flex-wrap: wrap; align-items: center; }
    .project-no { font-size: 28px; font-weight: 700; color: #f8fafc; margin-bottom: 4px; }
    .donuts-row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 20px; width: 100%; flex: 1; }
    .progress-section { margin-top: 24px; padding-top: 16px; border-top: 1px solid #334155; }
    .progress-bar { height: 16px; background: #334155; border-radius: 8px; overflow: hidden; margin: 8px 0; }
    .progress-fill { height: 100%; background: linear-gradient(90deg, #34d399, #3b82f6); width: 0%; }
    .dashboard-tools { display: flex; gap: 16px; margin-bottom: 16px; flex-wrap: wrap; }
    .quick-links { flex: 2; background: #1e293b; border: 1px solid #334155; border-radius: 8px; padding: 20px; display: grid; grid-template-columns: repeat(auto-fit, minmax(100px, 1fr)); gap: 12px; }
    .link-btn { display: flex; flex-direction: column; align-items: center; justify-content: center; background: #0f172a; border: 1px solid #334155; border-radius: 8px; padding: 16px 8px; color: #cbd5e1; text-decoration: none; font-size: 13px; font-weight: 600; cursor: pointer; }
    .kpi-panel { flex: 1; min-width: 250px; background: #1e293b; border: 1px solid #334155; border-radius: 8px; padding: 20px; display: flex; justify-content: space-around; align-items: center; }
    .kpi-value { font-size: 24px; font-weight: 700; font-family: monospace; }
    .slicer-panel { background: #1e293b; border: 1px solid #334155; border-radius: 8px; padding: 20px; margin-bottom: 16px; display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px; }
    .filter-btn { background: #1e293b; border: 1px solid #334155; color: #cbd5e1; padding: 4px 10px; border-radius: 4px; font-size: 11px; cursor: pointer; }
    .filter-btn.active { background: #3b82f6; border-color: #3b82f6; color: #fff; }
    .charts-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
    .chart-card { background: #1e293b; border: 1px solid #334155; border-radius: 8px; padding: 20px; }
    .canvas-container { position: relative; height: 320px; width: 100%; }
    
    /* 🚀 상세 내역 영역 스타일 추가 */
    #detailView { margin-top: 24px; background: #1e293b; border: 1px solid #334155; border-radius: 8px; padding: 20px; display: none; }
    #detailTable { width: 100%; border-collapse: collapse; margin-top: 10px; }
    #detailTable th, #detailTable td { padding: 12px; text-align: left; border-bottom: 1px solid #334155; font-size: 13px; }
    #detailTable th { color: #94a3b8; }
    @media(max-width: 768px) { .charts-grid { grid-template-columns: 1fr; } .donuts-row { grid-template-columns: 1fr 1fr; } }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <div class="header-top">
        <div class="project-basic"><div class="project-no">Project 7</div></div>
        <div class="donuts-row" id="donuts"></div>
      </div>
      <div class="progress-section"><div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div></div>
    </div>
    <div class="dashboard-tools">
      <div class="quick-links" id="quickLinks">
        <a href="#" class="link-btn">Works</a><a href="#" class="link-btn">PMO</a>
        <a href="#" class="link-btn">통합관리</a><a href="#" class="link-btn">Data Base</a>
        <a href="#" class="link-btn">Master Plan</a><a href="#" class="link-btn">상세이력</a>
      </div>
      <div class="kpi-panel">
        <div>공수 합계<div class="kpi-value" id="kpi-md">0.0</div></div>
        <div>ISSUE 합계<div class="kpi-value" id="kpi-issue">0</div></div>
        <div>미완료 합계<div class="kpi-value" id="kpi-incomp">0</div></div>
      </div>
    </div>
    <div class="slicer-panel" id="slicers"></div>
    <div class="charts-grid">
      <div class="chart-card"><div class="canvas-container"><canvas id="mdChart"></canvas></div></div>
      <div class="chart-card"><div class="canvas-container"><canvas id="statusChart"></canvas></div></div>
    </div>
    <div id="detailView">
      <div id="detailHeader" style="font-weight:700; color:#3b82f6; margin-bottom:10px;">상세 내역</div>
      <table id="detailTable"></table>
    </div>
  </div>

  <script>
    // 기존 로직들 모두 유지
    const API_URL = 'https://script.google.com/macros/s/AKfycbwwCFRGw4cpFOtPZITa1kt6P2cO92TIG-UZcv3CXu9igPeaGHkwTm4hcp_iEer5O1edPQ/exec';
    let rawData = []; let mdChartInstance = null; let statusChartInstance = null;
    let activeFilters = {'단계 구분':'All','대응 구분':'All','유/무상':'All','파트 구분':'All','진행상태':'All'};

    // 상세 내용 표시 함수
    function showDetail(date, category, isMd) {
      const detailView = document.getElementById('detailView');
      const filtered = rawData.filter(r => {
        const d = (r['접수일'] || r['완료예정일']);
        const matchDate = d && d.includes(date);
        const matchCat = isMd ? r['업무 구분'] === category : r['진행상태'] === category;
        return matchDate && matchCat;
      });
      if(filtered.length > 0) {
        detailView.style.display = 'block';
        document.getElementById('detailHeader').textContent = `[ ${date} / ${category} 상세 리스트 ]`;
        let html = '<tr><th>내용</th><th>공수</th><th>상태</th></tr>';
        filtered.forEach(r => html += `<tr><td>${r['내용']||'-'}</td><td>${r['공수(MD)']||'-'}</td><td>${r['진행상태']||'-'}</td></tr>`);
        document.getElementById('detailTable').innerHTML = html;
        detailView.scrollIntoView({ behavior: 'smooth' });
      }
    }

    // [기존 함수들: renderDonuts, renderSlicers, syncDashboard 그대로 유지]
    // (여기 생략된 부분은 기존 코드의 renderDonuts, renderSlicers, updateCharts를 그대로 넣으시면 됩니다!)
    
    // updateCharts 내의 Chart 생성 옵션에 추가:
    // options: { ... onClick: (e, el, chart) => { if(el.length) showDetail(chart.data.labels[el[0].index], chart.data.datasets[el[0].datasetIndex].label, true); }, ... }
  </script>
</body>
</html>
