:8px;padding:16px}.filter-row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}.filter-btn{padding:6px 12px;font-size:12px;border:0.5px solid #d0d0d0;background:white;border-radius:4px;cursor:pointer}.filter-btn.active{background:#1d9e75;color:white;border-color:#1d9e75}table{width:100%;border-collapse:collapse;font-size:12px}th{text-align:left;padding:8px;background:#f9f9f9;border-bottom:1px solid #e0e0e0;font-weight:600;color:#666}td{padding:8px;border-bottom:0.5px solid #f0f0f0}tr:hover{background:#fafafa}.badge{display:inline-block;padding:3px 8px;border-radius:3px;font-size:11px;font-weight:500}.badge-complete{background:#e1f5ee;color:#0f6e56}.badge-progress{background:#e6f1fb;color:#185fa5}.badge-hold{background:#faeeda;color:#854f0b}.badge-delay{background:#fcebeb;color:#a32d2d}@media(max-width:768px){.header-top{flex-direction:column}.donuts-row{justify-content:center}.charts-row{grid-template-columns:1fr}.kpi-panel{flex:1}}</style>
