<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>Control Tower - Project 7</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    body { background: #0f172a; color: #f8fafc; font-family: sans-serif; }
    .container { max-width: 1400px; margin: 0 auto; padding: 20px; }
    .charts-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-top: 20px; }
    .chart-card { background: #1e293b; padding: 20px; border-radius: 8px; height: 350px; }
    #detailView { margin-top: 20px; background: #1e293b; padding: 20px; border-radius: 8px; display: none; }
    table { width: 100%; border-collapse: collapse; margin-top: 10px; color: #fff; }
    th, td { padding: 10px; border-bottom: 1px solid #334155; text-align: left; font-size: 13px; }
  </style>
</head>
<body>
  <div class="container">
    <div class="charts-grid">
      <div class="chart-card"><canvas id="mdChart"></canvas></div>
      <div class="chart-card"><canvas id="statusChart"></canvas></div>
    </div>
    <div id="detailView">
      <div id="detailHeader" style="font-weight:700; color:#3b82f6;"></div>
      <table id="detailTable"></table>
    </div>
  </div>

  <script>
    const API_URL = 'https://script.google.com/macros/s/AKfycbwwCFRGw4cpFOtPZITa1kt6P2cO92TIG-UZcv3CXu9igPeaGHkwTm4hcp_iEer5O1edPQ/exec';
    let rawData = [];
    let mdChartInstance, statusChartInstance;

    function showDetail(date, category, isMd) {
      const filtered = rawData.filter(r => {
        const d = (r['접수일'] || r['완료예정일']);
        return d && d.includes(date) && (isMd ? r['업무 구분'] === category : r['진행상태'] === category);
      });
      document.getElementById('detailView').style.display = filtered.length ? 'block' : 'none';
      document.getElementById('detailHeader').textContent = `[ ${date} / ${category} 상세 ]`;
      document.getElementById('detailTable').innerHTML = '<tr><th>내용</th><th>공수</th><th>상태</th></tr>' +
        filtered.map(r => `<tr><td>${r['내용']}</td><td>${r['공수(MD)']}</td><td>${r['진행상태']}</td></tr>`).join('');
    }

    async function fetchData() {
      const res = await fetch(API_URL);
      const data = await res.json();
      rawData = data.history;
      updateCharts();
    }

    function updateCharts() {
      let dates = [...new Set(rawData.map(r => r['접수일'] || r['완료예정일']).filter(v => v))].sort();

      const mdTypes = ['표준', '개선', 'Issue', '기술지원'];
      if (mdChartInstance) mdChartInstance.destroy();
      mdChartInstance = new Chart(document.getElementById('mdChart'), {
        type: 'bar',
        data: {
          labels: dates.map(d => d.substring(2)),
          datasets: mdTypes.map(t => ({
            label: t,
            data: dates.map(d => rawData.filter(r => (r['접수일']===d||r['완료예정일']===d) && r['업무 구분']===t).reduce((s,r)=>s+(parseFloat(r['공수(MD)'])||0),0)),
            backgroundColor: t === 'Issue' ? '#ef4444' : '#3b82f6'
          }))
        },
        options: {
          responsive: true, maintainAspectRatio: false,
          onClick: (e, el, chart) => { if(el.length) showDetail(dates[el[0].index], chart.data.datasets[el[0].datasetIndex].label, true); }
        }
      });

      const statusTypes = ['완료', '지연중', '보류'];
      if (statusChartInstance) statusChartInstance.destroy();
      statusChartInstance = new Chart(document.getElementById('statusChart'), {
        type: 'bar',
        data: {
          labels: dates.map(d => d.substring(2)),
          datasets: statusTypes.map(t => ({
            label: t,
            data: dates.map(d => rawData.filter(r => (r['접수일']===d||r['완료예정일']===d) && r['진행상태']===t).length),
            backgroundColor: t === '완료' ? '#34d399' : '#f59e0b'
          }))
        },
        options: {
          responsive: true, maintainAspectRatio: false,
          onClick: (e, el, chart) => { if(el.length) showDetail(dates[el[0].index], chart.data.datasets[el[0].datasetIndex].label, false); }
        }
      });
    }

    fetchData();
  </script>
</body>
</html>
