<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Real-time Control Tower - Project 7</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    /* Slate Dark Mode UI Base */
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #0f172a; color: #f8fafc; }
    .container { max-width: 1400px; margin: 0 auto; padding: 16px; }
    
    /* Header (도넛 & 막대) */
    .header { background: #1e293b; border: 1px solid #334155; border-radius: 8px; padding: 24px; margin-bottom: 16px; }
    .header-top { display: flex; gap: 20px; flex-wrap: wrap; align-items: center; }
    .project-basic { flex: 0 0 auto; min-width: 150px; }
    .project-no { font-size: 28px; font-weight: 700; color: #f8fafc; margin-bottom: 4px; }
    .donuts-row { display: flex; gap: 20px; flex: 1; justify-content: space-around; min-width: 400px; }
    
    .progress-section { margin-top: 24px; padding-top: 16px; border-top: 1px solid #334155; }
    .progress-bar { height: 16px; background: #334155; border-radius: 8px; overflow: hidden; margin: 8px 0; }
    .progress-fill { height: 100%; background: linear-gradient(90deg, #34d399, #3b82f6); width: 0%; transition: width 1.5s ease-out; }
    
    .donut-box { text-align: center; flex: 1; display: flex; flex-direction: column; align-items: center; }
    .donut-label { font-size: 13px; font-weight: 600; color: #94a3b8; margin-bottom: 10px; }
    .donut-status { font-size: 14px; font-weight: 700; margin-top: 12px; margin-bottom: 16px; }
    .donut-details { width: 100%; max-width: 180px; font-size: 12px; }
    .detail-row { display: flex; justify-content: space-between; margin-bottom: 6px; }
    .detail-label { color: #94a3b8; }
    .detail-val { color: #e2e8f0; font-weight: 500; font-family: monospace; font-size: 13px;}

    /* 🎛️ Slicer (필터 버튼) 영역 */
    .slicer-panel { background: #1e293b; border: 1px solid #334155; border-radius: 8px; padding: 20px; margin-bottom: 16px; display: flex; flex-wrap: wrap; gap: 24px; }
    .filter-group { display: flex; flex-direction: column; gap: 8px; }
    .filter-title { font-size: 12px; color: #94a3b8; font-weight: 600; text-transform: uppercase; }
    .filter-buttons { display: flex; gap: 8px; flex-wrap: wrap; }
    .filter-btn { background: #0f172a; border: 1px solid #334155; color: #94a3b8; padding: 6px 14px; border-radius: 20px; font-size: 12px; cursor: pointer; transition: all 0.2s; }
    .filter-btn:hover { border-color: #3b82f6; color: #f8fafc; }
    .filter-btn.active { background: #3b82f6; border-color: #3b82f6; color: #fff; font-weight: 600; }
    .filter-btn.all { border-style: dashed; }

    /* 📊 Chart 영역 */
    .charts-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
    .chart-card { background: #1e293b; border: 1px solid #334155; border-radius: 8px; padding: 20px; }
    .chart-title { font-size: 16px; font-weight: 600; color: #f8fafc; margin-bottom: 16px; }
    .canvas-container { position: relative; height: 300px; width: 100%; }
    
    @media(max-width: 1024px) { .charts-grid { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <div class="header-top">
        <div class="project-basic">
          <div class="project-no">Project 7</div>
          <div style="font-size: 12px; color: #64748b;">Interactive Dashboard</div>
        </div>
        <div class="donuts-row" id="donuts"><div style="opacity:0.5; padding:20px;">데이터 로딩 중...</div></div>
      </div>
      <div class="progress-section">
        <div style="display:flex; justify-content:space-between; align-items:center;">
          <span style="font-size:14px; color:#94a3b8; font-weight:600;">Overall Progress</span>
          <span style="font-size:18px; font-weight:700; color:#3b82f6;" id="progressText">0%</span>
        </div>
        <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
      </div>
    </div>

    <div class="slicer-panel" id="slicers">
      </div>

    <div class="charts-grid">
      <div class="chart-card">
        <div class="chart-title">공수 집계 (업무 구분별)</div>
        <div class="canvas-container"><canvas id="mdChart"></canvas></div>
      </div>
      <div class="chart-card">
        <div class="chart-title">진행 현황 (진행 상태별 건수)</div>
        <div class="canvas-container"><canvas id="statusChart"></canvas></div>
      </div>
    </div>
  </div>

  <script>
    // 🚀 최신 API URL 적용 완료
    const API_URL = 'https://script.google.com/macros/s/AKfycbwwCFRGw4cpFOtPZITa1kt6P2cO92TIG-UZcv3CXu9igPeaGHkwTm4hcp_iEer5O1edPQ/exec';

    let rawData = []; 
    let mdChartInstance = null;
    let statusChartInstance = null;
    
    let activeFilters = {
      '단계 구분': 'All',
      '파트 구분': 'All',
      '유/무상': 'All'
    };

    Chart.defaults.color = '#94a3b8';
    Chart.defaults.borderColor = '#334155';

    function formatDate(dateStr) {
      if(dateStr && dateStr.length === 10 && dateStr.startsWith('20')) return dateStr.substring(2);
      return dateStr || '-';
    }

    // ========== 1. 상단 도넛 렌더링 ==========
    function renderDonuts(summaryData) {
      const labels = ['제작', 'FAT', 'SET-UP', 'SAT'];
      const donutHTML = labels.map((label, i) => {
        const comp = summaryData.complete[i] || 0;
        const incomp = summaryData.incomplete[i] || 0;
        const total = comp + incomp;
        const percent = total === 0 ? 0 : Math.round((comp / total) * 100);
        
        const statusText = summaryData.status[i] || 'Waiting';
        const dashArray = `${percent}, 100`;
        
        let themeColor = '#fbbf24'; 
        const statusLower = statusText.toLowerCase();
        if (statusLower.includes('completed')) themeColor = '#34d399'; 
        else if (statusLower.includes('progress')) themeColor = '#3b82f6'; 

        const circleColor = percent === 0 ? '#334155' : themeColor;
        const rowData = summaryData.details[i] || []; 
        const rateStr = rowData[5] || '0%'; 
        const rateNum = parseFloat(rateStr.replace(/[^0-9.-]/g, '')) || 0;
        const isOverLimit = rateNum > 100;
        const rateColor = isOverLimit ? '#ef4444' : '#e2e8f0'; 
        
        let detailsHTML = '';
        if (i === 0) {
          detailsHTML = `
            <div class="donut-details">
              <div class="detail-row"><span class="detail-label">시작일</span><span class="detail-val">${formatDate(rowData[0])}</span></div>
              <div class="detail-row"><span class="detail-label">완료일</span><span class="detail-val">${formatDate(rowData[2])}</span></div>
              <div class="detail-row"><span class="detail-label">기한 대비율</span><span class="detail-val" style="color:${rateColor}; font-weight:${isOverLimit?'700':'500'};">${rateStr}</span></div>
            </div>`;
        } else {
          detailsHTML = `
            <div class="donut-details">
              <div class="detail-row"><span class="detail-label">계획 공수</span><span class="detail-val">${rowData[1]||'0.0'}</span></div>
              <div class="detail-row"><span class="detail-label">소요 공수</span><span class="detail-val">${rowData[2]||'0.0'}</span></div>
              <div class="detail-row"><span class="detail-label">소진율</span><span class="detail-val" style="color:${rateColor}; font-weight:${isOverLimit?'700':'500'};">${rateStr}</span></div>
            </div>`;
        }

        return `
          <div class="donut-box">
            <div class="donut-label">${label}</div>
            <div style="position: relative; width: 90px; height: 90px; margin: 0 auto;">
              <svg viewBox="0 0 36 36" style="width: 100%; height: 100%;">
                <path d="M18 2.0845 a 15.9155 15.9155 0 0 1 0 31.831 a 15.9155 15.9155 0 0 1 0 -31.831" fill="none" stroke="#0f172a" stroke-width="3"/>
                <path d="M18 2.0845 a 15.9155 15.9155 0 0 1 0 31.831 a 15.9155 15.9155 0 0 1 0 -31.831" fill="none" stroke="${circleColor}" stroke-width="3.5" stroke-dasharray="${dashArray}" style="stroke-linecap: round;"/>
              </svg>
              <div style="position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); font-size: 19px; font-weight: 700; color: ${themeColor};">${percent}%</div>
            </div>
            <div class="donut-status" style="color:${themeColor}">${statusText}</div>
            ${detailsHTML}
          </div>`;
      }).join(''); 

      document.getElementById('donuts').innerHTML = donutHTML;
      document.getElementById('progressFill').style.width = summaryData.overall || '0%';
      document.getElementById('progressText').textContent = summaryData.overall || '0%';
    }

    // ========== 2. 슬라이서 (필터) 렌더링 및 로직 ==========
    function renderSlicers() {
      const container = document.getElementById('slicers');
      container.innerHTML = '';
      
      const filterCategories = ['단계 구분', '파트 구분', '유/무상'];
      
      filterCategories.forEach(category => {
        const uniqueValues = [...new Set(rawData.map(row => row[category]).filter(val => val))];
        if(uniqueValues.length === 0) return;

        const groupDiv = document.createElement('div');
        groupDiv.className = 'filter-group';
        
        let buttonsHTML = `<button class="filter-btn all ${activeFilters[category] === 'All' ? 'active' : ''}" onclick="applyFilter('${category}', 'All')">All</button>`;
        uniqueValues.forEach(val => {
          const isActive = activeFilters[category] === val ? 'active' : '';
          buttonsHTML += `<button class="filter-btn ${isActive}" onclick="applyFilter('${category}', '${val}')">${val}</button>`;
        });

        groupDiv.innerHTML = `<div class="filter-title">${category}</div><div class="filter-buttons">${buttonsHTML}</div>`;
        container.appendChild(groupDiv);
      });
    }

    window.applyFilter = function(category, value) {
      activeFilters[category] = value;
      renderSlicers(); 
      updateCharts();  
    }

    // ========== 3. 차트 렌더링 로직 ==========
    function updateCharts() {
      let filteredData = rawData.filter(row => {
        for (let cat in activeFilters) {
          if (activeFilters[cat] !== 'All' && row[cat] !== activeFilters[cat]) return false;
        }
        return true;
      });

      let months = [...new Set(filteredData.map(r => r['월']).filter(v => v))].sort();
      
      const colorMap = {
        '표준': '#94a3b8', '개선': '#34d399', 'Issue': '#ef4444', '기술지원': '#fbbf24', 
        '완료': '#34d399', '지연중': '#ef4444', '보류': '#94a3b8', '임박': '#fbbf24' 
      };

      // --- Chart 1 ---
      const mdTypes = ['표준', '개선', 'Issue', '기술지원']; 
      const mdDatasets = mdTypes.map(type => {
        return {
          label: type,
          backgroundColor: colorMap[type] || '#64748b',
          data: months.map(m => {
            return filteredData.filter(r => r['월'] === m && r['업무 구분'] === type)
                               .reduce((sum, r) => sum + (parseFloat(r['공수(MD)']) || 0), 0);
          })
        };
      });

      if (mdChartInstance) mdChartInstance.destroy();
      mdChartInstance = new Chart(document.getElementById('mdChart'), {
        type: 'bar',
        data: { labels: months, datasets: mdDatasets },
        options: { responsive: true, maintainAspectRatio: false, scales: { x: { stacked: true }, y: { stacked: true } } }
      });

      // --- Chart 2 ---
      const statusTypes = [...new Set(filteredData.map(r => r['진행상태']).filter(v=>v))];
      const statusDatasets = statusTypes.map(type => {
        return {
          label: type,
          backgroundColor: colorMap[type] || '#3b82f6',
          data: months.map(m => {
            return filteredData.filter(r => r['월'] === m && r['진행상태'] === type).length;
          })
        };
      });

      if (statusChartInstance) statusChartInstance.destroy();
      statusChartInstance = new Chart(document.getElementById('statusChart'), {
        type: 'bar',
        data: { labels: months, datasets: statusDatasets },
        options: { responsive: true, maintainAspectRatio: false, scales: { x: { stacked: true }, y: { stacked: true, ticks: { stepSize: 1 } } } }
      });
    }

    // ========== 초기화 및 실행 ==========
    async function syncDashboard() {
      const cached = localStorage.getItem('project7_dashboard_v2');
      if (cached) {
        try {
          const parsed = JSON.parse(cached);
          renderDonuts(parsed.summary);
          rawData = parsed.history || [];
          if(rawData.length > 0) { renderSlicers(); updateCharts(); }
        } catch(e) {
           console.error('캐시 파싱 에러', e);
        }
      }

      try {
        const response = await fetch(API_URL, { redirect: 'follow' });
        const freshData = await response.json();
        
        localStorage.setItem('project7_dashboard_v2', JSON.stringify(freshData));
        
        renderDonuts(freshData.summary);
        rawData = freshData.history || [];
        renderSlicers();
        updateCharts();

      } catch (err) {
        console.error('동기화 실패:', err);
      }
    }

    window.addEventListener('load', syncDashboard);
  </script>
</body>
</html>
