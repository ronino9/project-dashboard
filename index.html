<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Real-time Control Tower - Dashboard</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #0f172a; color: #f8fafc; }
    .container { max-width: 1400px; margin: 0 auto; padding: 16px; }
    
    /* 탭 메뉴 스타일 */
    .tabs { display: flex; gap: 10px; margin-bottom: 20px; }
    .tab-btn { padding: 12px 24px; background: #1e293b; color: #94a3b8; border: 1px solid #334155; border-radius: 8px; cursor: pointer; font-weight: 700; font-size: 15px; transition: all 0.2s; }
    .tab-btn:hover { background: #2a3a55; color: #f8fafc; }
    .tab-btn.active { background: #3b82f6; color: #fff; border-color: #3b82f6; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1); }

    .header { background: #1e293b; border: 1px solid #334155; border-radius: 8px; padding: 24px; margin-bottom: 16px; }
    .header-top { display: flex; gap: 20px; flex-wrap: wrap; align-items: center; }
    .project-basic { flex: 0 0 auto; min-width: 150px; }
    .project-no { font-size: 28px; font-weight: 700; color: #f8fafc; margin-bottom: 4px; }
    .donuts-row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 20px; width: 100%; flex: 1; }
    .progress-section { margin-top: 24px; padding-top: 16px; border-top: 1px solid #334155; }
    .progress-bar { height: 16px; background: #334155; border-radius: 8px; overflow: hidden; margin: 8px 0; }
    .progress-fill { height: 100%; background: linear-gradient(90deg, #34d399, #3b82f6); width: 0%; transition: width 1.5s ease-out; }
    .donut-box { text-align: center; display: flex; flex-direction: column; align-items: center; }
    .donut-label { font-size: 13px; font-weight: 600; color: #94a3b8; margin-bottom: 10px; }
    .donut-status { font-size: 14px; font-weight: 700; margin-top: 12px; margin-bottom: 16px; }
    .donut-details { width: 100%; max-width: 180px; font-size: 12px; }
    .detail-row { display: flex; justify-content: space-between; margin-bottom: 6px; }
    .detail-label { color: #94a3b8; }
    .detail-val { color: #e2e8f0; font-weight: 500; font-family: monospace; font-size: 13px; }
    
    .dashboard-tools { display: flex; gap: 16px; margin-bottom: 16px; flex-wrap: wrap; }
    .quick-links { flex: 2; background: #1e293b; border: 1px solid #334155; border-radius: 8px; padding: 20px; display: grid; grid-template-columns: repeat(auto-fit, minmax(100px, 1fr)); gap: 12px; }
    .link-btn { display: flex; flex-direction: column; align-items: center; justify-content: center; background: #0f172a; border: 1px solid #334155; border-radius: 8px; padding: 16px 8px; color: #cbd5e1; text-decoration: none; font-size: 13px; font-weight: 600; transition: all 0.2s; cursor: pointer; gap: 8px; }
    .link-btn:hover { border-color: #3b82f6; color: #f8fafc; transform: translateY(-2px); }
    .link-icon { font-size: 24px; }
    .kpi-panel { flex: 1; min-width: 250px; background: #1e293b; border: 1px solid #334155; border-radius: 8px; padding: 20px; display: flex; justify-content: space-around; align-items: center; }
    .kpi-item { text-align: center; }
    .kpi-title { font-size: 12px; color: #94a3b8; font-weight: 600; margin-bottom: 8px; }
    .kpi-value { font-size: 24px; font-weight: 700; font-family: monospace; }
    .val-md { color: #e2e8f0; }
    .val-issue { color: #ef4444; }
    .val-incomp { color: #f59e0b; }
    
    .slicer-panel { background: #1e293b; border: 1px solid #334155; border-radius: 8px; padding: 20px; margin-bottom: 16px; display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px; }
    .filter-group { display: flex; flex-direction: column; gap: 8px; background: #0f172a; padding: 12px; border-radius: 6px; border: 1px solid #334155; }
    .filter-title { font-size: 12px; color: #3b82f6; font-weight: 700; text-transform: uppercase; border-bottom: 1px solid #223047; padding-bottom: 4px; margin-bottom: 4px; }
    .filter-buttons { display: flex; gap: 6px; flex-wrap: wrap; }
    .filter-btn { background: #1e293b; border: 1px solid #334155; color: #cbd5e1; padding: 4px 10px; border-radius: 4px; font-size: 11px; cursor: pointer; transition: all 0.15s; }
    .filter-btn:hover { border-color: #3b82f6; color: #f8fafc; }
    .filter-btn.active { background: #3b82f6; border-color: #3b82f6; color: #fff; font-weight: 600; }
    .filter-btn.all { border-style: dashed; }
    
    .charts-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 16px; }
    .chart-card { background: #1e293b; border: 1px solid #334155; border-radius: 8px; padding: 20px; cursor: pointer; }
    .chart-title { font-size: 16px; font-weight: 600; color: #f8fafc; margin-bottom: 16px; }
    .canvas-container { position: relative; height: 320px; width: 100%; }
    
    #detailView { background: #1e293b; border: 1px solid #3b82f6; border-radius: 8px; padding: 20px; margin-top: 16px; display: none; }
    #detailHeader { font-size: 15px; font-weight: 700; color: #3b82f6; margin-bottom: 12px; display: flex; justify-content: space-between; align-items: center; }
    #detailClose { cursor: pointer; color: #64748b; font-size: 20px; }
    #detailClose:hover { color: #f8fafc; }
    #detailTable { width: 100%; border-collapse: collapse; font-size: 12px; }
    #detailTable th { text-align: left; padding: 8px; background: #0f172a; border-bottom: 1px solid #334155; color: #94a3b8; font-weight: 600; }
    #detailTable td { padding: 8px; border-bottom: 1px solid #1e293b; color: #e2e8f0; }
    #detailTable tr:hover { background: #0f172a; }
    
    /* =========================================
       [업데이트] 톤 다운된 다크모드 뱃지 스타일 
       배경은 반투명(rgba)으로, 글자색은 선명하게 세팅
       ========================================= */
    .badge { display: inline-block; padding: 3px 8px; border-radius: 4px; font-size: 11px; font-weight: 600; }
    
    /* 1. 진행상태 뱃지 */
    .badge-완료 { background: rgba(39, 174, 96, 0.15); color: #2ecc71; border: 1px solid rgba(39, 174, 96, 0.3); }
    .badge-지연중 { background: rgba(192, 57, 43, 0.15); color: #e74c3c; border: 1px solid rgba(192, 57, 43, 0.3); }
.badge-보류 { background: rgba(100, 116, 139, 0.15); color: #94a3b8; border: 1px solid rgba(100, 116, 139, 0.3); } /* 완전한 무채색(슬레이트 그레이) */
    .badge-지연완료 { background: rgba(139, 92, 246, 0.15); color: #a78bfa; border: 1px solid rgba(139, 92, 246, 0.3); } /* 차분한 연보라(라벤더)로 확실히 분리 */
    .badge-지연완료 { background: rgba(115, 138, 148, 0.15); color: #a3b8c2; border: 1px solid rgba(115, 138, 148, 0.3); } /* 그레이시 블루 */

    /* 2. 업무 구분 뱃지 */
    .badge-표준 { background: rgba(127, 140, 141, 0.15); color: #bdc3c7; border: 1px solid rgba(127, 140, 141, 0.3); }
    .badge-개선 { background: rgba(39, 174, 96, 0.15); color: #2ecc71; border: 1px solid rgba(39, 174, 96, 0.3); }
    .badge-Issue { background: rgba(192, 57, 43, 0.15); color: #e74c3c; border: 1px solid rgba(192, 57, 43, 0.3); }
    .badge-기술지원 { background: rgba(212, 172, 13, 0.15); color: #f1c40f; border: 1px solid rgba(212, 172, 13, 0.3); }
    .badge-기능요구 { background: rgba(52, 152, 219, 0.15); color: #5dade2; border: 1px solid rgba(52, 152, 219, 0.3); } /* 소프트 블루 */

    @media(max-width: 1024px) { 
      .charts-grid { grid-template-columns: 1fr; } 
      .donuts-row { grid-template-columns: 1fr 1fr; }
      .dashboard-tools { flex-direction: column; }
    }
  </style>
</head>
<body>
  <div class="container">
    
    <div class="tabs">
      <button id="btn-project7" class="tab-btn active" onclick="switchProject('project7')">Project 7</button>
      <button id="btn-project6" class="tab-btn" onclick="switchProject('project6')">Project 6</button>
      <button id="btn-project3" class="tab-btn" onclick="switchProject('project3')">Project 3</button>
    </div>

    <div class="header">
      <div class="header-top">
        <div class="project-basic">
          <div class="project-no" id="projectTitle">Project 7</div>
          <div style="font-size: 12px; color: #64748b;">Interactive Control Tower</div>
        </div>
        <div class="donuts-row" id="donuts"><div style="opacity:0.5; padding:20px;">데이터 로드 중...</div></div>
      </div>
      <div class="progress-section">
        <div style="display:flex; justify-content:space-between; align-items:center;">
          <span style="font-size:14px; color:#94a3b8; font-weight:600;">Overall Progress</span>
          <span style="font-size:18px; font-weight:700; color:#3b82f6;" id="progressText">0%</span>
        </div>
        <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
      </div>
    </div>

    <div class="dashboard-tools">
      <div class="quick-links">
        <a href="#" class="link-btn"><span class="link-icon">💼</span>Works</a>
        <a href="#" class="link-btn"><span class="link-icon">📋</span>PMO</a>
        <a href="#" class="link-btn"><span class="link-icon">📑</span>통합관리</a>
        <a href="#" class="link-btn"><span class="link-icon">🗄️</span>Data Base</a>
        <a href="#" class="link-btn"><span class="link-icon">🗺️</span>Master Plan</a>
        <a href="#" class="link-btn"><span class="link-icon">🔍</span>상세이력</a>
      </div>
      <div class="kpi-panel">
        <div class="kpi-item"><div class="kpi-title">공수 합계</div><div class="kpi-value val-md" id="kpi-md">0.0</div></div>
        <div class="kpi-item"><div class="kpi-title">ISSUE 합계</div><div class="kpi-value val-issue" id="kpi-issue">0</div></div>
        <div class="kpi-item"><div class="kpi-title">미완료 합계</div><div class="kpi-value val-incomp" id="kpi-incomp">0</div></div>
      </div>
    </div>

    <div class="slicer-panel" id="slicers"></div>

    <div class="charts-grid">
      <div class="chart-card">
        <div class="chart-title">공수 집계 <span style="font-size:12px;color:#64748b;">(막대 클릭 → 상세)</span></div>
        <div class="canvas-container"><canvas id="mdChart"></canvas></div>
      </div>
      <div class="chart-card">
        <div class="chart-title">진행 현황 <span style="font-size:12px;color:#64748b;">(막대 클릭 → 상세)</span></div>
        <div class="canvas-container"><canvas id="statusChart"></canvas></div>
      </div>
    </div>

    <div id="detailView">
      <div id="detailHeader">
        <span id="detailTitle"></span>
        <span id="detailClose" onclick="closeDetail()">✕</span>
      </div>
      <table id="detailTable"></table>
      <div style="font-size:12px;color:#64748b;margin-top:8px;" id="detailCount"></div>
    </div>
  </div>

  <script>
    const API_URL = 'https://script.google.com/macros/s/AKfycbxePNgd4UVagav5GLyl5y9T05R8GygLFTvKLzDBvNASKuCB1eCR-VQKSeO8HPzOWxdMeA/exec';

    let allData = {}; 
    let currentProjectId = 'project7'; 
    
    let rawData = [];
    let mdChartInstance = null;
    let statusChartInstance = null;
    let currentDates = [];
    let activeFilters = { '단계 구분': 'All', '대응 구분': 'All', '유/무상': 'All', '파트 구분': 'All', '진행상태': 'All' };

    Chart.defaults.color = '#94a3b8';
    Chart.defaults.borderColor = '#334155';

    function formatDate(dateStr) {
      if (!dateStr) return '-';
      return dateStr.toString().substring(2);
    }

    window.closeDetail = function() {
      document.getElementById('detailView').style.display = 'none';
    }

    // 🔄 탭 전환 유연화 (3개 프로젝트 완벽 대응)
    window.switchProject = function(projectId) {
      currentProjectId = projectId;
      
      // 모든 버튼의 active 지우고 선택된 것만 부여
      document.getElementById('btn-project7').className = 'tab-btn';
      document.getElementById('btn-project6').className = 'tab-btn';
      document.getElementById('btn-project3').className = 'tab-btn';
      document.getElementById(`btn-${projectId}`).className = 'tab-btn active';
      
      // 제목 자동 매핑
      const titleMap = { 'project7': 'Project 7', 'project6': 'Project 6', 'project3': 'Project 3' };
      document.getElementById('projectTitle').textContent = titleMap[projectId] || 'Project';

      // 필터 초기화
      activeFilters = { '단계 구분': 'All', '대응 구분': 'All', '유/무상': 'All', '파트 구분': 'All', '진행상태': 'All' };
      
      // 데이터 바인딩 및 렌더링
      if(allData[projectId]) {
        rawData = allData[projectId].history || [];
        renderDonuts(allData[projectId].summary);
        renderSlicers();
        updateCharts();
        closeDetail();
      }
    }

    function showDetail(date, category, isMd) {
      const filtered = rawData.filter(r => {
        if (!r['접수일'] || r['접수일'] !== date) return false;
        return isMd ? r['업무 구분'] === category : r['진행상태'] === category;
      });

      if (filtered.length === 0) return;

      document.getElementById('detailView').style.display = 'block';
      document.getElementById('detailTitle').textContent = `[ ${formatDate(date)} / ${category} ] 상세 이력`;
      document.getElementById('detailCount').textContent = `총 ${filtered.length}건`;

      const badgeClass = { '완료': 'badge-완료', '지연중': 'badge-지연중', '보류': 'badge-보류', '임박': 'badge-임박', '지연완료': 'badge-지연완료' };

      document.getElementById('detailTable').innerHTML = `
        <tr>
          <th>#</th><th>업무구분</th><th>진행상태</th><th>내용</th><th>진행사항</th><th>지연사유</th><th>완료예정일</th><th>지연일</th><th>접수일</th>
        </tr>` +
        filtered.map((r, i) => `
          <tr>
            <td>${i + 1}</td>
            <td><span class="badge badge-${r['업무 구분'] || '표준'}">${r['업무 구분'] || ''}</span></td>
            <td><span class="badge ${badgeClass[r['진행상태']] || ''}">${r['진행상태'] || ''}</span></td>
            <td style="max-width:250px;">${r['표준 제작 Item / Issue / 개선사항'] || ''}</td>
            <td style="max-width:200px;">${r['진행 사항'] || ''}</td>
            <td style="max-width:200px;">${r['지연 사유'] || ''}</td>
            <td>${r['완료예정일'] || ''}</td>
            <td>${r['지연일'] || ''}</td>
            <td>${r['접수일'] || ''}</td>
          </tr>`).join('');

      document.getElementById('detailView').scrollIntoView({ behavior: 'smooth' });
    }

    function renderDonuts(summaryData) {
      const labels = ['제작', 'FAT', 'SET-UP', 'SAT'];
      const donutHTML = labels.map((label, i) => {
        const comp = summaryData.complete[i] || 0;
        const incomp = summaryData.incomplete[i] || 0;
        const total = comp + incomp;
        const percent = total === 0 ? 0 : Math.round((comp / total) * 100);
        const statusText = summaryData.status[i] || 'Waiting';
        let themeColor = '#fbbf24';
        if (statusText.toLowerCase().includes('completed')) themeColor = '#34d399';
        else if (statusText.toLowerCase().includes('progress')) themeColor = '#3b82f6';
        const circleColor = percent === 0 ? '#334155' : themeColor;
        const rowData = summaryData.details[i] || [];
        const rateStr = rowData[5] || '0%';
        const rateNum = parseFloat(rateStr.replace(/[^0-9.-]/g, '')) || 0;
        const rateColor = rateNum > 100 ? '#ef4444' : '#e2e8f0';
        let detailsHTML = i === 0
          ? `<div class="donut-details"><div class="detail-row"><span class="detail-label">시작일</span><span class="detail-val">${formatDate(rowData[0])}</span></div><div class="detail-row"><span class="detail-label">완료일</span><span class="detail-val">${formatDate(rowData[2])}</span></div><div class="detail-row"><span class="detail-label">기한 대비율</span><span class="detail-val" style="color:${rateColor};">${rateStr}</span></div></div>`
          : `<div class="donut-details"><div class="detail-row"><span class="detail-label">계획 공수</span><span class="detail-val">${rowData[1]||'0.0'}</span></div><div class="detail-row"><span class="detail-label">소요 공수</span><span class="detail-val">${rowData[2]||'0.0'}</span></div><div class="detail-row"><span class="detail-label">소진율</span><span class="detail-val" style="color:${rateColor};">${rateStr}</span></div></div>`;
        return `<div class="donut-box"><div class="donut-label">${label}</div><div style="position:relative;width:90px;height:90px;margin:0 auto;"><svg viewBox="0 0 36 36" style="width:100%;height:100%;"><path d="M18 2.0845 a 15.9155 15.9155 0 0 1 0 31.831 a 15.9155 15.9155 0 0 1 0 -31.831" fill="none" stroke="#0f172a" stroke-width="3"/><path d="M18 2.0845 a 15.9155 15.9155 0 0 1 0 31.831 a 15.9155 15.9155 0 0 1 0 -31.831" fill="none" stroke="${circleColor}" stroke-width="3.5" stroke-dasharray="${percent}, 100" style="stroke-linecap:round;"/></svg><div style="position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);font-size:19px;font-weight:700;color:${themeColor};">${percent}%</div></div><div class="donut-status" style="color:${themeColor}">${statusText}</div>${detailsHTML}</div>`;
      }).join('');
      document.getElementById('donuts').innerHTML = donutHTML;
      document.getElementById('progressFill').style.width = summaryData.overall || '0%';
      document.getElementById('progressText').textContent = summaryData.overall || '0%';
    }

    function renderSlicers() {
      const container = document.getElementById('slicers');
      container.innerHTML = '';
      const filterCategories = ['단계 구분', '대응 구분', '유/무상', '파트 구분', '진행상태'];
      filterCategories.forEach(category => {
        const uniqueValues = [...new Set(rawData.map(row => row[category]).filter(val => val && val.trim() !== ''))];
        if (uniqueValues.length === 0) return;
        const groupDiv = document.createElement('div');
        groupDiv.className = 'filter-group';
        let buttonsHTML = `<button class="filter-btn all ${activeFilters[category] === 'All' ? 'active' : ''}" onclick="window.applyFilter('${category}', 'All')">All</button>`;
        uniqueValues.forEach(val => {
          buttonsHTML += `<button class="filter-btn ${activeFilters[category] === val ? 'active' : ''}" onclick="window.applyFilter('${category}', '${val}')">${val}</button>`;
        });
        groupDiv.innerHTML = `<div class="filter-title">${category}</div><div class="filter-buttons">${buttonsHTML}</div>`;
        container.appendChild(groupDiv);
      });
    }

    window.applyFilter = function(category, value) {
      activeFilters[category] = value;
      renderSlicers();
      updateCharts();
      closeDetail();
    }

    function updateCharts() {
      let filteredData = rawData.filter(row => {
        for (let cat in activeFilters) {
          if (activeFilters[cat] !== 'All' && row[cat] !== activeFilters[cat]) return false;
        }
        return true;
      });

      let sumMD = 0, countIssue = 0, countIncomplete = 0;
      filteredData.forEach(r => {
        sumMD += parseFloat(r['공수(MD)']) || 0;
        if (r['업무 구분'] === 'Issue') countIssue++;
        const status = r['진행상태'] || '';
        if (status && !status.includes('완료')) countIncomplete++;
      });
      document.getElementById('kpi-md').textContent = sumMD.toFixed(1);
      document.getElementById('kpi-issue').textContent = countIssue;
      document.getElementById('kpi-incomp').textContent = countIncomplete;

      currentDates = [...new Set(filteredData.map(r => r['접수일']).filter(v => v && v.toString().trim() !== ''))].sort();

      /* =========================================
         [업데이트] 톤 다운된 헥스(HEX) 코드로 변경
         차트에 그려지는 막대 색상들도 부드럽게 세팅됩니다.
         ========================================= */
const colorMap = { 
        '표준': '#7F8C8D', 
        '개선': '#27AE60', 
        'Issue': '#C0392B', 
        '기술지원': '#D4AC0D', 
        '기능요구': '#3498DB', 
        '완료': '#27AE60', 
        '지연중': '#C0392B', 
        '보류': '#64748b', /* 무채색 회색 */
        '임박': '#D35400', 
        '지연완료': '#a78bfa' /* 차분한 연보라 */
      };

      const mdTypes = ['표준', '개선', 'Issue', '기술지원', '기능요구'];
      if (mdChartInstance) mdChartInstance.destroy();
      mdChartInstance = new Chart(document.getElementById('mdChart'), {
        type: 'bar',
        data: {
          labels: currentDates.map(d => formatDate(d)),
          datasets: mdTypes.map(type => ({
            label: type,
            backgroundColor: colorMap[type],
            data: currentDates.map(d => filteredData.filter(r => r['접수일'] === d && r['업무 구분'] === type).reduce((sum, r) => sum + (parseFloat(r['공수(MD)']) || 0), 0))
          }))
        },
        options: {
          responsive: true, maintainAspectRatio: false,
          plugins: { legend: { position: 'top' } },
          scales: { x: { stacked: true }, y: { stacked: true } },
          onClick: (e, el) => {
            if (el.length) showDetail(currentDates[el[0].index], mdTypes[el[0].datasetIndex], true);
          }
        }
      });

      const statusTypes = ['완료', '지연중', '보류', '임박', '지연완료'];
      if (statusChartInstance) statusChartInstance.destroy();
      statusChartInstance = new Chart(document.getElementById('statusChart'), {
        type: 'bar',
        data: {
          labels: currentDates.map(d => formatDate(d)),
          datasets: statusTypes.map(type => ({
            label: type,
            backgroundColor: colorMap[type],
            data: currentDates.map(d => filteredData.filter(r => r['접수일'] === d && r['진행상태'] === type).length)
          }))
        },
        options: {
          responsive: true, maintainAspectRatio: false,
          plugins: { legend: { position: 'top' } },
          scales: { x: { stacked: true }, y: { stacked: true, ticks: { stepSize: 1 } } },
          onClick: (e, el) => {
            if (el.length) showDetail(currentDates[el[0].index], statusTypes[el[0].datasetIndex], false);
          }
        }
      });
    }

    async function syncDashboard() {
      try {
        const response = await fetch(API_URL, { redirect: 'follow' });
        allData = await response.json(); 
        
        // 기본 시작 화면을 Project 7로 셋팅
        switchProject('project7'); 
        
      } catch (err) {
        console.error('동기화 실패:', err);
      }
    }

    window.addEventListener('load', syncDashboard);
  </script>
</body>
</html>
