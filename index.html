<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Real-time Control Tower - Dashboard</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #0f172a; color: #f8fafc; }
    .container { max-width: 1400px; margin: 0 auto; padding: 16px; }
    .tabs { display: flex; gap: 10px; margin-bottom: 20px; }
    .tab-btn { padding: 12px 24px; background: #1e293b; color: #94a3b8; border: 1px solid #334155; border-radius: 8px; cursor: pointer; font-weight: 700; font-size: 15px; transition: all 0.2s; }
    .tab-btn:hover { background: #2a3a55; color: #f8fafc; }
    .tab-btn.active { background: #3b82f6; color: #fff; border-color: #3b82f6; }
    .header { background: #1e293b; border: 1px solid #334155; border-radius: 8px; padding: 24px; margin-bottom: 16px; }
    .header-top { display: flex; gap: 20px; flex-wrap: wrap; align-items: center; }
    .project-no { font-size: 28px; font-weight: 700; color: #f8fafc; margin-bottom: 4px; }
    .donuts-row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 20px; width: 100%; flex: 1; }
    .progress-bar { height: 16px; background: #334155; border-radius: 8px; overflow: hidden; margin: 8px 0; }
    .progress-fill { height: 100%; background: linear-gradient(90deg, #34d399, #3b82f6); width: 0%; transition: width 1.5s ease-out; }
    .dashboard-tools { display: flex; gap: 16px; margin-bottom: 16px; flex-wrap: wrap; }
    .quick-links { flex: 2; background: #1e293b; border: 1px solid #334155; border-radius: 8px; padding: 20px; display: grid; grid-template-columns: repeat(auto-fit, minmax(100px, 1fr)); gap: 12px; }
    .link-btn { display: flex; flex-direction: column; align-items: center; justify-content: center; background: #0f172a; border: 1px solid #334155; border-radius: 8px; padding: 16px 8px; color: #cbd5e1; text-decoration: none; font-size: 13px; font-weight: 600; cursor: pointer; }
    .kpi-panel { flex: 1; background: #1e293b; border: 1px solid #334155; border-radius: 8px; padding: 20px; display: flex; justify-content: space-around; align-items: center; }
    .kpi-item { text-align: center; }
    .kpi-title { font-size: 12px; color: #94a3b8; font-weight: 600; margin-bottom: 8px; }
    .kpi-value { font-size: 24px; font-weight: 700; font-family: monospace; }
    .slicer-panel { background: #1e293b; border: 1px solid #334155; border-radius: 8px; padding: 20px; margin-bottom: 16px; display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px; }
    .filter-group { display: flex; flex-direction: column; gap: 8px; background: #0f172a; padding: 12px; border-radius: 6px; border: 1px solid #334155; }
    .filter-title { font-size: 12px; color: #3b82f6; font-weight: 700; text-transform: uppercase; border-bottom: 1px solid #223047; padding-bottom: 4px; margin-bottom: 4px; }
    .filter-buttons { display: flex; gap: 6px; flex-wrap: wrap; }
    .filter-btn { background: #1e293b; border: 1px solid #334155; color: #cbd5e1; padding: 4px 10px; border-radius: 4px; font-size: 11px; cursor: pointer; }
    .filter-btn.active { background: #3b82f6; border-color: #3b82f6; color: #fff; font-weight: 600; }
    .charts-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 16px; }
    .chart-card { background: #1e293b; border: 1px solid #334155; border-radius: 8px; padding: 20px; }
    .chart-title { font-size: 16px; font-weight: 600; color: #f8fafc; margin-bottom: 16px; }
    .canvas-container { position: relative; height: 320px; width: 100%; }
    #detailView { background: #1e293b; border: 1px solid #3b82f6; border-radius: 8px; padding: 20px; margin-top: 16px; display: none; }
    #detailTable { width: 100%; border-collapse: collapse; font-size: 12px; }
    #detailTable th { text-align: left; padding: 8px; background: #0f172a; border-bottom: 1px solid #334155; color: #94a3b8; font-weight: 600; }
    #detailTable td { padding: 8px; border-bottom: 1px solid #1e293b; color: #e2e8f0; }
    .badge { display: inline-block; padding: 3px 8px; border-radius: 4px; font-size: 11px; font-weight: 600; }
    @media(max-width: 1024px) { .charts-grid { grid-template-columns: 1fr; } .donuts-row { grid-template-columns: 1fr 1fr; } }
  </style>
</head>
<body>
  <div class="container">
    <div class="tabs">
      <button id="btn-project7" class="tab-btn active" onclick="window.switchTab('project7')">Project 7</button>
      <button id="btn-project6" class="tab-btn" onclick="window.switchTab('project6')">Project 6</button>
      <button id="btn-project3" class="tab-btn" onclick="window.switchTab('project3')">Project 3</button>
      <button id="btn-project1cs" class="tab-btn" onclick="window.switchTab('project1cs')">🎯 Project 1 C/S</button>
      <button id="btn-daily" class="tab-btn" onclick="window.switchTab('daily')">📋 일일 공수</button>
    </div>

    <div class="header">
      <div class="header-top">
        <div style="flex: 0 0 auto;">
          <div class="project-no" id="projectTitle">Project 7</div>
          <div style="font-size: 12px; color: #64748b;">Interactive Control Tower</div>
        </div>
        <div class="donuts-row" id="donuts"><div style="opacity:0.5; padding:20px;">데이터 로드 중...</div></div>
      </div>
      <div style="margin-top: 24px; padding-top: 16px; border-top: 1px solid #334155;">
        <div style="display:flex; justify-content:space-between; align-items:center;">
          <span style="font-size:14px; color:#94a3b8; font-weight:600;">Overall Progress</span>
          <span style="font-size:18px; font-weight:700; color:#3b82f6;" id="progressText">0%</span>
        </div>
        <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
      </div>
    </div>

    <div class="dashboard-tools">
      <div class="quick-links">
        <a href="#" class="link-btn"><span style="font-size:24px;">💼</span><span>Works</span></a>
        <a href="#" class="link-btn"><span style="font-size:24px;">📋</span><span>PMO</span></a>
        <a href="#" class="link-btn"><span style="font-size:24px;">📑</span><span>통합관리</span></a>
        <a href="#" class="link-btn"><span style="font-size:24px;">🗄️</span><span>Data Base</span></a>
        <a href="#" class="link-btn"><span style="font-size:24px;">🗺️</span><span>Master Plan</span></a>
        <a href="#" class="link-btn"><span style="font-size:24px;">🔍</span><span>상세이력</span></a>
      </div>
      <div class="kpi-panel">
        <div class="kpi-item"><div class="kpi-title">공수 합계</div><div class="kpi-value" style="color: #e2e8f0;" id="kpi-md">0.0</div></div>
        <div class="kpi-item"><div class="kpi-title">ISSUE 합계</div><div class="kpi-value" style="color: #ef4444;" id="kpi-issue">0</div></div>
        <div class="kpi-item"><div class="kpi-title">미완료 합계</div><div class="kpi-value" style="color: #f59e0b;" id="kpi-incomp">0</div></div>
      </div>
    </div>

    <div class="slicer-panel" id="slicers"></div>

<div class="charts-grid">
  <div class="chart-card">
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px;">
      <div class="chart-title" style="margin: 0;">공수 집계</div>
      <div style="display: flex; gap: 16px; font-size: 12px; color: var(--color-text-secondary);">
        <span style="display: flex; align-items: center; gap: 6px;"><span style="width: 12px; height: 12px; background: #3b82f6; border-radius: 2px;"></span>유상</span>
        <span style="display: flex; align-items: center; gap: 6px;"><span style="width: 12px; height: 12px; background: #d1d5db; border-radius: 2px;"></span>무상</span>
      </div>
    </div>
    <div class="canvas-container"><canvas id="mdChart"></canvas></div>
  </div>
      <div class="chart-card">
        <div class="chart-title">진행 현황</div>
        <div class="canvas-container"><canvas id="statusChart"></canvas></div>
      </div>
    </div>

    <div id="detailView">
      <div style="font-size: 15px; font-weight: 700; color: #3b82f6; margin-bottom: 12px; display: flex; justify-content: space-between;">
        <span id="detailTitle"></span>
        <span id="detailClose" onclick="window.closeDetail()" style="cursor: pointer;">✕</span>
      </div>
      <table id="detailTable"></table>
    </div>

    <!-- C/S 리스크맵 뷰 -->
    <div id="cs-view" style="display: none; grid-template-columns: 1fr 300px; gap: 16px;">
<!-- 좌측: C/S 리스크맵 -->
<div style="background: #1e293b; border: 1px solid #334155; border-radius: 8px; padding: 20px;">
  <div style="font-size: 16px; font-weight: 600; color: #f8fafc; margin-bottom: 12px;">C/S 프로젝트 리스크맵</div>
  <div style="display: flex; gap: 16px; flex-wrap: wrap; margin-bottom: 16px; padding: 12px; background: #0f172a; border-radius: 6px; border: 1px solid #334155;">
    <div style="display: flex; align-items: center; gap: 6px;"><div style="width: 16px; height: 16px; background: #86EFAC; border-radius: 50%;"></div><span style="color: #94a3b8; font-size: 12px;">안정</span></div>
    <div style="display: flex; align-items: center; gap: 6px;"><div style="width: 16px; height: 16px; background: #FCD34D; border-radius: 50%;"></div><span style="color: #94a3b8; font-size: 12px;">임박</span></div>
    <div style="display: flex; align-items: center; gap: 6px;"><div style="width: 16px; height: 16px; background: #F9A8D4; border-radius: 50%;"></div><span style="color: #94a3b8; font-size: 12px;">주의</span></div>
    <div style="display: flex; align-items: center; gap: 6px;"><div style="width: 16px; height: 16px; background: #FCA5A5; border-radius: 50%;"></div><span style="color: #94a3b8; font-size: 12px;">위험</span></div>
    <div style="display: flex; align-items: center; gap: 6px;"><div style="width: 16px; height: 16px; background: #EF4444; border-radius: 50%;"></div><span style="color: #94a3b8; font-size: 12px;">심각</span></div>
  </div>
  <div style="background: #0f172a; padding: 12px; border-radius: 6px; margin-bottom: 16px; border: 1px solid #334155;">
    <label style="color: #94a3b8; font-size: 12px; display: block; margin-bottom: 8px;">원 간격 조절</label>
    <div style="display: flex; gap: 8px; align-items: center;">
      <input type="range" id="spacingSlider" min="20" max="100" value="50" style="flex: 1; cursor: pointer; height: 6px;">
      <span id="spacingValue" style="color: #e2e8f0; min-width: 40px; text-align: right; font-weight: bold; font-size: 13px;">50</span>
    </div>
  </div>
  <canvas id="csBubbleCanvas" style="width: 100%; height: 500px; background: #0f172a; border-radius: 6px; display: block;"></canvas>
</div>

<!-- 우측: 전체 C/S 현황 (별도) -->
<div style="background: #1e293b; border: 1px solid #334155; border-radius: 8px; padding: 20px; margin-bottom: 16px;">
  <div style="font-size: 13px; font-weight: 700; color: #e2e8f0; margin-bottom: 12px; cursor: pointer;" onclick="window.toggleSection('totalStats')">▼ 전체 C/S 현황</div>
  <div id="totalStatsContent" style="display: block;"></div>
</div>

<!-- 우측: 프로젝트 정보 + 상세 현황 (같은 박스) -->
<div style="background: #1e293b; border: 1px solid #334155; border-radius: 8px; padding: 20px; height: fit-content; max-height: 600px; overflow-y: auto;">
  <div id="csProjectInfo" style="margin-bottom: 20px; padding-bottom: 16px; border-bottom: 1px solid #334155;">
    <div style="font-size: 14px; font-weight: 700; color: #3b82f6; margin-bottom: 12px;">프로젝트 정보</div>
    <div id="csDetailContent" style="color: #94a3b8; font-size: 12px;">버블을 클릭하면 상세 정보가 표시됩니다.</div>
  </div>
  
  <div id="csDetailStats">
    <div style="font-size: 13px; font-weight: 700; color: #e2e8f0; margin-bottom: 12px; cursor: pointer;" onclick="window.toggleSection('detailStats')">▼ 상세 현황</div>
    <div id="detailStatsContent" style="display: block;"></div>
  </div>
</div>
        

    

    <div id="daily-panel" style="display:none;">
      <div style="background:#1e293b; border:1px solid #334155; border-radius:8px; padding:24px;">
        <div style="display:flex; align-items:center; gap:12px; margin-bottom:20px;">
          <span style="font-size:15px; font-weight:700; color:#94a3b8;">📅 조회 날짜</span>
          <input type="date" id="daily-date-input" style="background:#0f172a; border:1px solid #334155; border-radius:6px; padding:8px 12px; color:#f8fafc; font-size:14px;" onchange="window.renderDailyLog()" />
        </div>
        <div id="daily-log-content">
          <div style="color:#64748b; font-size:14px;">날짜를 선택하면 공수 일지가 표시됩니다.</div>
        </div>
      </div>
    </div>
  </div>

  <script>
    const API_URL = 'https://script.google.com/macros/s/AKfycbxx3jNp0d4JmVSVisRQNPyZ46DstVHMLOeBCm3zyl2PChrbWoPGP2_hC3cDCWMfINMyhQ/exec';

    let allData = {}; 
    let currentProjectId = 'project7'; 
    let csRiskData = [];
    let csStatsData = {};
    let rawData = [];
    let mdChartInstance = null;
    let statusChartInstance = null;
    let currentDates = [];
    let activeFilters = { '단계 구분': 'All', '대응 구분': 'All', '유/무상': 'All', '파트 구분': 'All', '진행상태': 'All' };

    Chart.defaults.color = '#94a3b8';
    Chart.defaults.borderColor = '#334155';

    function formatDate(dateStr) {
      if (!dateStr) return '-';
      return dateStr.toString().substring(2);
    }

    window.closeDetail = function() {
      document.getElementById('detailView').style.display = 'none';
    }
    window.showDetailView = function(dateLabel, typeLabel, dataRows) {
      const detailView = document.getElementById('detailView');
      const detailTitle = document.getElementById('detailTitle');
      const detailTable = document.getElementById('detailTable');

      detailTitle.textContent = `${dateLabel} - [${typeLabel}] 상세 내역`;

      if (dataRows.length === 0) {
        detailTable.innerHTML = '<tr><td style="text-align:center;">데이터가 없습니다.</td></tr>';
      } else {
        const headers = ['프로젝트 코드', '업무 구분', '표준 제작 Item / Issue / 개선사항', '진행 사항', '공수(MD)', '진행상태'];
        let html = '<tr>' + headers.map(h => `<th>${h}</th>`).join('') + '</tr>';

        dataRows.forEach(row => {
          html += '<tr>' + headers.map(h => {
            let val = row[h] || '-';
            if (h === '진행상태') {
              let color = val.includes('완료') ? '#059669' : (val.includes('지연') || val === 'Issue' ? '#dc2626' : '#3b82f6');
              val = `<span class="badge" style="background:${color};">${val}</span>`;
            }
            return `<td>${val}</td>`;
          }).join('') + '</tr>';
        });
        detailTable.innerHTML = html;
      }
      detailView.style.display = 'block';
      detailView.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
    }

    window.toggleSection = function(section) {
      const content = document.getElementById(section + 'Content');
      if (content) {
        content.style.display = content.style.display === 'none' ? 'block' : 'none';
      }
    }

    async function syncDashboard() {
      try {
        const response = await fetch(API_URL, { redirect: 'follow' });
        allData = await response.json();
        
        if (allData.project1CsRiskMap) {
          csRiskData = allData.project1CsRiskMap;
        }
        
        if (allData.csStatistics) {
          csStatsData = allData.csStatistics;
          renderTotalStats();
        }
        
        window.switchProject('project7');
      } catch (err) {
        console.error('동기화 실패:', err);
      }
    }

    window.switchProject = function(projectId) {
      currentProjectId = projectId;
      
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      document.getElementById(`btn-${projectId}`).className = 'tab-btn active';
      
      const titleMap = { 'project7': 'Project 7', 'project6': 'Project 6', 'project3': 'Project 3' };
      document.getElementById('projectTitle').textContent = titleMap[projectId] || 'Project';

      activeFilters = { '단계 구분': 'All', '대응 구분': 'All', '유/무상': 'All', '파트 구분': 'All', '진행상태': 'All' };
      
      if(allData[projectId]) {
        rawData = allData[projectId].history || [];
        renderDonuts(allData[projectId].summary);
        renderSlicers();
        updateCharts();
        window.closeDetail();
      }
    }

    function renderDonuts(summaryData) {
      const labels = ['제작', 'FAT', 'SET-UP', 'SAT'];
      const donutHTML = labels.map((label, i) => {
        const comp = summaryData.complete[i] || 0;
        const incomp = summaryData.incomplete[i] || 0;
        const total = comp + incomp;
        const percent = total === 0 ? 0 : Math.round((comp / total) * 100);
        const statusText = summaryData.status[i] || 'Waiting';
        let themeColor = '#fbbf24';
        if (statusText.toLowerCase().includes('completed')) themeColor = '#34d399';
        else if (statusText.toLowerCase().includes('progress')) themeColor = '#3b82f6';
        return `<div style="text-align: center;"><div style="font-size: 13px; color: #94a3b8; margin-bottom: 10px;">${label}</div><div style="position:relative;width:90px;height:90px;margin:0 auto;"><svg viewBox="0 0 36 36" style="width:100%;height:100%;"><circle cx="18" cy="18" r="15.9155" fill="none" stroke="#0f172a" stroke-width="3"/><circle cx="18" cy="18" r="15.9155" fill="none" stroke="${themeColor}" stroke-width="3.5" stroke-dasharray="${percent}, 100" style="stroke-linecap:round;"/></svg><div style="position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);font-size:19px;font-weight:700;color:${themeColor};">${percent}%</div></div><div style="margin-top: 12px; color:${themeColor}; font-weight: 700;">${statusText}</div></div>`;
      }).join('');
      document.getElementById('donuts').innerHTML = donutHTML;
      document.getElementById('progressFill').style.width = summaryData.overall || '0%';
      document.getElementById('progressText').textContent = summaryData.overall || '0%';
    }

    function renderSlicers() {
      const container = document.getElementById('slicers');
      container.innerHTML = '';
      const filterCategories = ['단계 구분', '대응 구분', '유/무상', '파트 구분', '진행상태'];
      filterCategories.forEach(category => {
        const uniqueValues = [...new Set(rawData.map(row => row[category]).filter(val => val && val.trim() !== ''))];
        if (uniqueValues.length === 0) return;
        const groupDiv = document.createElement('div');
        groupDiv.className = 'filter-group';
        let buttonsHTML = `<button class="filter-btn ${activeFilters[category] === 'All' ? 'active' : ''}" onclick="window.applyFilter('${category}', 'All')">All</button>`;
        uniqueValues.forEach(val => {
          buttonsHTML += `<button class="filter-btn ${activeFilters[category] === val ? 'active' : ''}" onclick="window.applyFilter('${category}', '${val}')">${val}</button>`;
        });
        groupDiv.innerHTML = `<div class="filter-title">${category}</div><div class="filter-buttons">${buttonsHTML}</div>`;
        container.appendChild(groupDiv);
      });
    }

    window.applyFilter = function(category, value) {
      activeFilters[category] = value;
      renderSlicers();
      updateCharts();
      window.closeDetail();
    }

function updateCharts() {
      let filteredData = rawData.filter(row => {
        for (let cat in activeFilters) {
          if (activeFilters[cat] !== 'All' && row[cat] !== activeFilters[cat]) return false;
        }
        return true;
      });

      let sumMD = 0, countIssue = 0, countIncomplete = 0;
      filteredData.forEach(r => {
        sumMD += parseFloat(r['공수(MD)']) || 0;
        if (r['업무 구분'] === 'Issue') countIssue++;
        const status = r['진행상태'] || '';
        if (status && !status.includes('완료')) countIncomplete++;
      });
      document.getElementById('kpi-md').textContent = sumMD.toFixed(1);
      document.getElementById('kpi-issue').textContent = countIssue;
      document.getElementById('kpi-incomp').textContent = countIncomplete;

      currentDates = [...new Set(filteredData.map(r => r['접수일']).filter(v => v && v.toString().trim() !== ''))].sort();

      const colorMap = { '표준': '#7F8C8D', '개선': '#27AE60', 'Issue': '#C0392B', '기술지원': '#D4AC0D', '기능요구': '#3498DB', '완료': '#27AE60', '지연중': '#C0392B', '보류': '#64748b', '임박': '#D35400', '지연완료': '#a78bfa' };

      // 1. 공수 집계 차트 (왼쪽)
      const mdTypes = ['표준', '개선', 'Issue', '기술지원', '기능요구'];
      if (mdChartInstance) mdChartInstance.destroy();
      mdChartInstance = new Chart(document.getElementById('mdChart'), {
        type: 'bar',
        data: {
          labels: currentDates.map(d => formatDate(d)),
          datasets: mdTypes.map(type => ({
            label: type,
            backgroundColor: colorMap[type],
            data: currentDates.map(d => filteredData.filter(r => r['접수일'] === d && r['업무 구분'] === type).reduce((sum, r) => sum + (parseFloat(r['공수(MD)']) || 0), 0))
          }))
        },
        options: {
          responsive: true, maintainAspectRatio: false,
          plugins: { legend: { position: 'top' } },
          scales: { x: { stacked: true }, y: { stacked: true } },
          onClick: (e, elements, chart) => {
            if (elements.length === 0) return;
            const idx = elements[0].index;
            const datasetIdx = elements[0].datasetIndex;
            const originalDate = currentDates[idx];
            const selectedType = chart.data.datasets[datasetIdx].label;

            const details = filteredData.filter(r => r['접수일'] === originalDate && r['업무 구분'] === selectedType);
            window.showDetailView(formatDate(originalDate), selectedType, details);
          }
        }
      });

      // 2. 진행 현황 차트 (오른쪽)
      const statusTypes = ['완료', '지연중', '보류', '임박', '지연완료'];
      if (statusChartInstance) statusChartInstance.destroy();
      statusChartInstance = new Chart(document.getElementById('statusChart'), {
        type: 'bar',
        data: {
          labels: currentDates.map(d => formatDate(d)),
          datasets: statusTypes.map(type => ({
            label: type,
            backgroundColor: colorMap[type],
            data: currentDates.map(d => filteredData.filter(r => r['접수일'] === d && r['진행상태'] === type).length)
          }))
        },
        options: {
          responsive: true, maintainAspectRatio: false,
          plugins: { legend: { position: 'top' } },
          scales: { x: { stacked: true }, y: { stacked: true, ticks: { stepSize: 1 } } },
          onClick: (e, elements, chart) => {
            if (elements.length === 0) return;
            const idx = elements[0].index;
            const datasetIdx = elements[0].datasetIndex;
            const originalDate = currentDates[idx];
            const selectedStatus = chart.data.datasets[datasetIdx].label;

            const details = filteredData.filter(r => r['접수일'] === originalDate && r['진행상태'] === selectedStatus);
            window.showDetailView(formatDate(originalDate), selectedStatus, details);
          }
        }
      });
    }

    function renderCsBubbleChart() {
      const canvas = document.getElementById('csBubbleCanvas');
      if (!canvas) return;
      
      const ctx = canvas.getContext('2d');
      const rect = canvas.getBoundingClientRect();
      canvas.width = rect.width;
      canvas.height = rect.height;

      const padding = 80;
      const graphWidth = canvas.width - padding * 2;
      const graphHeight = canvas.height - padding * 2;

      ctx.fillStyle = '#0f172a';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      if (csRiskData.length === 0) {
        ctx.fillStyle = '#64748b';
        ctx.font = '14px sans-serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText('데이터 없음', canvas.width / 2, canvas.height / 2);
        return;
      }

let maxX = Math.max(...csRiskData.map(p => p.x), 2) * 1.2;
let maxY = Math.max(...csRiskData.map(p => p.y), 2) * 1.2;

      // 디버그 확인용
console.log('maxX:', maxX, 'maxY:', maxY);

      ctx.strokeStyle = '#334155';
      ctx.lineWidth = 1;
      for (let i = 0; i <= 5; i++) {
        const x = padding + (graphWidth / 5) * i;
        const y = padding + (graphHeight / 5) * i;
        ctx.beginPath();
        ctx.moveTo(x, padding);
        ctx.lineTo(x, canvas.height - padding);
        ctx.stroke();
        ctx.beginPath();
        ctx.moveTo(padding, y);
        ctx.lineTo(canvas.width - padding, y);
        ctx.stroke();
      }

      ctx.strokeStyle = '#64748b';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(padding, canvas.height - padding);
      ctx.lineTo(canvas.width - padding, canvas.height - padding);
      ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(padding, padding);
      ctx.lineTo(padding, canvas.height - padding);
      ctx.stroke();
            // X축/Y축 레이블
      ctx.fillStyle = '#94a3b8';
      ctx.font = '12px sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'top';
      ctx.fillText('임박 수준 →', canvas.width / 2, canvas.height - 20);
      
      ctx.save();
      ctx.translate(20, canvas.height / 2);
      ctx.rotate(-Math.PI / 2);
      ctx.textAlign = 'center';
      ctx.fillText('← 지연 수준', 0, 0);
      ctx.restore();
      // X축 숫자 (동적)
      ctx.font = '11px sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'top';
      ctx.fillStyle = '#94a3b8';
      for (let i = 0; i <= 5; i++) {
        const value = (maxX / 5) * i;  // ← 추가
        const x = padding + (graphWidth / 5) * i;
        ctx.fillText(value.toFixed(1), x, canvas.height - padding + 20);  // i → value로 변경
      }
      
      // Y축 숫자 (동적)
      ctx.textAlign = 'right';
      ctx.textBaseline = 'middle';
      for (let i = 0; i <= 5; i++) {
        const value = (maxY / 5) * i;  // ← 이 줄 추가!
        const y = canvas.height - padding - (graphHeight / 5) * i;
        ctx.fillText(value.toFixed(1), padding - 15, y);  // i → value로 변경
      }

const colorMap = { '안정': '#86EFAC', '임박': '#FCD34D', '주의': '#F9A8D4', '위험': '#FCA5A5', '심각': '#EF4444' };

// 같은 좌표 그룹화 ← 추가!
const grouped = {};
csRiskData.forEach((project, idx) => {
  const key = `${project.x.toFixed(2)},${project.y.toFixed(2)}`;
  if (!grouped[key]) grouped[key] = [];
  grouped[key].push({ ...project, originalIndex: idx });
});

csRiskData.forEach((project, index) => {
        let x = padding + (project.x / maxX) * graphWidth;
        let y = canvas.height - padding - (project.y / maxY) * graphHeight;
const radius = (project.size / 100) * 20 + 15;

        // 대각선 배치 ← 추가!
        const key = `${project.x.toFixed(2)},${project.y.toFixed(2)}`;
        const groupIndex = grouped[key].findIndex(p => p.originalIndex === index);
        const groupSize = grouped[key].length;

        if (groupSize > 1) {
          const spacing = window.bubbleSpacing || 50;
          x += groupIndex * spacing;
          y -= groupIndex * spacing;
        }

        let color = colorMap[project.status] || '#86EFAC';

        ctx.fillStyle = color;
        ctx.globalAlpha = 0.7;
        ctx.beginPath();
        ctx.arc(x, y, radius, 0, Math.PI * 2);
        ctx.fill();
        ctx.globalAlpha = 1;

        ctx.strokeStyle = color;
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.arc(x, y, radius, 0, Math.PI * 2);
        ctx.stroke();

        ctx.fillStyle = '#f8fafc';
        ctx.font = 'bold 13px monospace';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(project.name, x, y);

        project.x_pixel = x;
        project.y_pixel = y;
        project.radius = radius;
      });

      canvas.onclick = (e) => {
        const rect = canvas.getBoundingClientRect();
        const mouseX = e.clientX - rect.left;
        const mouseY = e.clientY - rect.top;

        csRiskData.forEach(project => {
          const dist = Math.sqrt(Math.pow(mouseX - project.x_pixel, 2) + Math.pow(mouseY - project.y_pixel, 2));
          if (dist < project.radius) {
            selectCsProject(project);
          }
        });
      };
    }

    function selectCsProject(project) {
      const html = `
        <div style="margin-bottom: 16px; padding-bottom: 12px; border-bottom: 1px solid #334155;">
          <div style="font-size: 11px; color: #94a3b8; font-weight: 600; text-transform: uppercase; margin-bottom: 4px;">프로젝트명</div>
          <div style="font-size: 18px; font-weight: 700; color: #f8fafc; font-family: monospace;">${project.name}</div>
        </div>
        <div style="margin-bottom: 16px; padding-bottom: 12px; border-bottom: 1px solid #334155;">
          <div style="font-size: 11px; color: #94a3b8; font-weight: 600; text-transform: uppercase; margin-bottom: 4px;">상태</div>
          <div style="font-size: 18px; font-weight: 700; color: #f8fafc;">${project.status}</div>
        </div>
<div style="margin-bottom: 20px;">
      <div style="font-size: 11px; color: #94a3b8; font-weight: 600; text-transform: uppercase; margin-bottom: 4px;">정보</div>
      <div style="font-size: 13px; color: #e2e8f0; margin-bottom: 8px;">진행율: ${project.progress}%</div>
      <div style="font-size: 13px; color: #e2e8f0; margin-bottom: 8px;">임박 수준: ${project.x.toFixed(1)}</div>
      <div style="font-size: 13px; color: #e2e8f0;">지연일: ${project.y.toFixed(1)}</div>
    </div>
      `;
      document.getElementById('csDetailContent').innerHTML = html;
      renderDetailStats(project.name);
    }

function renderDetailStats(projectNo) {
  const content = document.getElementById('detailStatsContent');
  
  if (!csStatsData.detail || !csStatsData.detail[projectNo]) {
    content.innerHTML = '<div style="color: #64748b; font-size: 12px;">데이터 없음</div>';
    return;
  }

  const projectData = csStatsData.detail[projectNo];
  let html = '<div style="display: flex; gap: 16px; font-size: 12px; color: var(--color-text-secondary); margin-bottom: 12px;"><span style="display: flex; align-items: center; gap: 6px;"><span style="width: 12px; height: 12px; background: #3b82f6; border-radius: 2px;"></span>유상</span><span style="display: flex; align-items: center; gap: 6px;"><span style="width: 12px; height: 12px; background: #d1d5db; border-radius: 2px;"></span>무상</span></div>';

      for (const taskType in projectData) {
        html += `<div style="margin-bottom: 12px;"><div style="color: #cbd5e1; font-size: 11px; margin-bottom: 6px; font-weight: 600;">${taskType}</div>`;
        for (const partType in projectData[taskType]) {
          const data = projectData[taskType][partType];
          const total = data.유상 + data.무상;
          const ratio = total > 0 ? (data.유상 / total * 100).toFixed(0) : 0;
          html += `<div style="margin-bottom: 6px; font-size: 11px;"><div style="color: #94a3b8; margin-bottom: 4px;">${partType}</div><div style="display: flex; height: 20px; border-radius: 4px; overflow: hidden; background: #0f172a;"><div style="background: #3b82f6; width: ${ratio}%; display: flex; align-items: center; justify-content: center; color: #fff; font-weight: bold; font-size: 10px;">${data.유상.toFixed(1)}</div><div style="background: #6b7280; flex: 1; display: flex; align-items: center; justify-content: center; color: #fff; font-weight: bold; font-size: 10px;">${data.무상.toFixed(1)}</div></div></div>`;
        }
        html += '</div>';
      }

      content.innerHTML = html;
    }

function renderTotalStats() {
  const content = document.getElementById('totalStatsContent');
  
  if (!csStatsData.detail) {
    content.innerHTML = '<div style="color: #64748b; font-size: 12px;">데이터 없음</div>';
    return;
  }

  let html = '<div style="display: flex; gap: 16px; font-size: 12px; color: var(--color-text-secondary); margin-bottom: 12px;"><span style="display: flex; align-items: center; gap: 6px;"><span style="width: 12px; height: 12px; background: #3b82f6; border-radius: 2px;"></span>유상</span><span style="display: flex; align-items: center; gap: 6px;"><span style="width: 12px; height: 12px; background: #d1d5db; border-radius: 2px;"></span>무상</span></div>';
  
  // 모든 프로젝트의 데이터를 합산
  const aggregated = {};
  
  for (const projectNo in csStatsData.detail) {
    const projectData = csStatsData.detail[projectNo];
    
    for (const taskType in projectData) {
      if (!aggregated[taskType]) aggregated[taskType] = {};
      
      for (const partType in projectData[taskType]) {
        if (!aggregated[taskType][partType]) {
          aggregated[taskType][partType] = { 유상: 0, 무상: 0 };
        }
        
        aggregated[taskType][partType].유상 += projectData[taskType][partType].유상;
        aggregated[taskType][partType].무상 += projectData[taskType][partType].무상;
      }
    }
  }
  
  // 렌더링
  for (const taskType in aggregated) {
    html += `<div style="margin-bottom: 16px;"><div style="color: #cbd5e1; font-size: 12px; margin-bottom: 8px; font-weight: 600;">${taskType}</div>`;
    
    for (const partType in aggregated[taskType]) {
      const data = aggregated[taskType][partType];
      const total = data.유상 + data.무상;
      const ratio = total > 0 ? (data.유상 / total * 100).toFixed(0) : 0;
      
      html += `<div style="margin-bottom: 8px;"><div style="color: #94a3b8; font-size: 11px; margin-bottom: 4px;">${partType}: ${total.toFixed(1)}MD</div><div style="display: flex; height: 20px; border-radius: 4px; overflow: hidden; background: #0f172a;"><div style="background: #3b82f6; width: ${ratio}%; display: flex; align-items: center; justify-content: center; color: #fff; font-weight: bold; font-size: 10px;">${data.유상.toFixed(1)}</div><div style="background: #d1d5db; flex: 1; display: flex; align-items: center; justify-content: center; color: var(--color-text-primary); font-weight: bold; font-size: 10px;">${data.무상.toFixed(1)}</div></div></div>`;
    }
    
    html += '</div>';
  }

  content.innerHTML = html;
}

    window.switchTab = function(tabId) {
      const header = document.querySelector('.header');
      const tools = document.querySelector('.dashboard-tools');
      const slicers = document.getElementById('slicers');
      const charts = document.querySelector('.charts-grid');
      const detailView = document.getElementById('detailView');
      const dailyPanel = document.getElementById('daily-panel');
      const csPanel = document.getElementById('cs-view');

      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));

      if (tabId === 'project1cs') {
        document.getElementById('btn-project1cs').classList.add('active');
        header.style.display = 'none';
        tools.style.display = 'none';
        slicers.style.display = 'none';
        charts.style.display = 'none';
        detailView.style.display = 'none';
        dailyPanel.style.display = 'none';
        csPanel.style.display = 'grid';
        setTimeout(() => renderCsBubbleChart(), 100);
      } else if (tabId === 'daily') {
        document.getElementById('btn-daily').classList.add('active');
        header.style.display = 'none';
        tools.style.display = 'none';
        slicers.style.display = 'none';
        charts.style.display = 'none';
        detailView.style.display = 'none';
        csPanel.style.display = 'none';
        dailyPanel.style.display = 'block';
      } else {
        document.getElementById('btn-' + tabId).classList.add('active');
        header.style.display = 'block';
        tools.style.display = 'flex';
        slicers.style.display = 'grid';
        charts.style.display = 'grid';
        detailView.style.display = 'none';
        csPanel.style.display = 'none';
        dailyPanel.style.display = 'none';
        window.switchProject(tabId);
      }
    }
    
    window.renderDailyLog = function() {
      const dateInput = document.getElementById('daily-date-input').value;
      const content = document.getElementById('daily-log-content');
      if (!dateInput) return;
      content.innerHTML = '<div style="color:#64748b;">날짜 선택됨: ' + dateInput + '</div>';
    }

    window.bubbleSpacing = 50;
    document.addEventListener('DOMContentLoaded', () => {
      const slider = document.getElementById('spacingSlider');
      if (slider) {
        slider.addEventListener('input', (e) => {
          window.bubbleSpacing = parseInt(e.target.value);
          document.getElementById('spacingValue').textContent = window.bubbleSpacing;
          renderCsBubbleChart();
        });
      }
    });

    window.addEventListener('load', syncDashboard);
  </script>
