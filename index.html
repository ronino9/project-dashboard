<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Control Tower Dashboard - Project 7</title>
  
  <link rel="icon" href="data:;base64,iVBORw0KGgoAAAANSUhEUgAAABAAAAAQEAMAAAHdfXoaAAAAD1BMVEUAAAD///////////////+Pj7BcAAAABXRSTlMAHzChw7M0MwAAAChJREFUeNpjYKAuYGJgYGBgYGJgYGJgYGJgYGJgYGJgYGJgYGJgYAMAMwQBDpXyX0YAAAAASUVORK5CYII=">

  <style>
    /* Slate Dark Mode UI 최적화 */
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #0f172a; color: #f8fafc; }
    .container { max-width: 1400px; margin: 0 auto; padding: 16px; }
    
    .header, .chart-card, .table-card { 
      background: #1e293b; 
      border: 1px solid #334155; 
      border-radius: 8px; 
      padding: 16px; 
      margin-bottom: 12px; 
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
    }
    
    .header-top { display: flex; gap: 20px; margin-bottom: 16px; flex-wrap: wrap; align-items: flex-start; }
    .project-basic { flex: 0 0 auto; min-width: 150px; }
    .project-no { font-size: 24px; font-weight: 600; color: #f8fafc; margin-bottom: 8px; }
    .basic-info { font-size: 12px; color: #94a3b8; line-height: 1.6; }
    .basic-info strong { color: #e2e8f0; display: block; margin-top: 4px; }
    
    .donuts-row { display: flex; gap: 16px; flex-wrap: wrap; flex: 1; min-width: 300px; }
    .kpi-panel { flex: 0 0 200px; display: flex; flex-direction: column; gap: 8px; }
    
    .progress-bar { height: 12px; background: #334155; border-radius: 6px; overflow: hidden; margin-top: 12px; }
    .progress-fill { height: 100%; background: #3b82f6; transition: width 0.3s; }
    
    .charts-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(400px, 1fr)); gap: 12px; margin-bottom: 12px; }
    .chart-title { font-size: 14px; font-weight: 600; margin-bottom: 12px; color: #f8fafc; }
    .chart-legend { display: flex; flex-wrap: wrap; gap: 12px; margin-bottom: 10px; font-size: 11px; color: #94a3b8; }
    .legend-item { display: flex; align-items: center; gap: 4px; }
    .legend-dot { width: 8px; height: 8px; border-radius: 2px; }
    .canvas-wrap { position: relative; height: 200px; }
    
    /* Table Styling */
    table { width: 100%; border-collapse: collapse; font-size: 12px; }
    th { text-align: left; padding: 10px 8px; background: #0f172a; border-bottom: 1px solid #334155; font-weight: 600; color: #cbd5e1; }
    td { padding: 10px 8px; border-bottom: 1px solid #334155; color: #f1f5f9; }
    tr:hover { background: #334155; transition: background 0.2s; }
    
    /* Dynamic Badges */
    .badge { display: inline-block; padding: 4px 8px; border-radius: 4px; font-size: 11px; font-weight: 600; }
    .badge-complete { background: rgba(16, 185, 129, 0.2); color: #34d399; border: 1px solid rgba(16, 185, 129, 0.3); }
    .badge-progress { background: rgba(59, 130, 246, 0.2); color: #60a5fa; border: 1px solid rgba(59, 130, 246, 0.3); }
    .badge-hold { background: rgba(245, 158, 11, 0.2); color: #fbbf24; border: 1px solid rgba(245, 158, 11, 0.3); }
    .badge-delay { background: rgba(239, 68, 68, 0.2); color: #f87171; border: 1px solid rgba(239, 68, 68, 0.3); }
    
    .loading-text { text-align: center; padding: 20px; color: #94a3b8; font-size: 14px; }
    
    @media(max-width: 768px) {
      .header-top { flex-direction: column; }
      .charts-row { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <div class="header-top">
        <div class="project-basic">
          <div class="project-no">Project 7</div>
          <div class="basic-info">
            <div><strong>발주처</strong></div>
            <div style="margin-top:4px;"><strong>납품처</strong></div>
            <div style="margin-top:4px;">Start: 2026.01.26</div>
          </div>
        </div>
        <div class="donuts-row" id="donuts"></div>
        <div class="kpi-panel" id="kpi"></div>
      </div>
      <div style="margin-top:12px;">
        <div style="display:flex;align-items:center;gap:10px;margin-bottom:4px;">
          <span style="font-size:12px;color:#94a3b8;">Overall Progress</span>
          <div class="progress-bar" style="flex:1;margin:0;">
            <div class="progress-fill" id="progressFill" style="width:48%"></div>
          </div>
          <span style="font-size:12px;font-weight:600;color:#60a5fa;" id="progressText">48%</span>
        </div>
      </div>
    </div>

    <div class="charts-row">
      <div class="chart-card">
        <div class="chart-title">공수 집계</div>
        <div class="chart-legend">
          <div class="legend-item"><div class="legend-dot" style="background:#fbbf24;"></div>기술지원</div>
          <div class="legend-item"><div class="legend-dot" style="background:#f87171;"></div>Issue</div>
          <div class="legend-item"><div class="legend-dot" style="background:#34d399;"></div>개선</div>
        </div>
        <div class="canvas-wrap"><canvas id="chartMD" style="max-height:200px;"></canvas></div>
      </div>
      <div class="chart-card">
        <div class="chart-title">진행 현황 (건수)</div>
        <div class="chart-legend">
          <div class="legend-item"><div class="legend-dot" style="background:#f87171;"></div>지연중</div>
          <div class="legend-item"><div class="legend-dot" style="background:#34d399;"></div>완료</div>
        </div>
        <div class="canvas-wrap"><canvas id="chartCnt" style="max-height:200px;"></canvas></div>
      </div>
    </div>

    <div class="table-card">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;">
        <div class="chart-title" style="margin:0;">이력 사항 DB</div>
      </div>
      <div style="overflow-x: auto;">
        <table>
          <thead>
            <tr id="tableHeaders"></tr>
          </thead>
          <tbody id="dataBody">
            <tr><td colspan="8" class="loading-text">Google Sheets 데이터를 불러오는 중입니다...</td></tr>
          </tbody>
        </table>
      </div>
      <div style="font-size:12px;color:#64748b;margin-top:12px;padding-top:12px;border-top:1px solid #334155;" id="rowCount"></div>
    </div>
  </div>

  <script>
    // 업데이트된 새 배포 GAS 웹앱 URL
    const API_URL = 'https://script.google.com/macros/s/AKfycbycw-REYRcQVIG0n1-FBZRU4VQV9MtLGAGvFqtewffulObrKr3SnjrzN0N8xNetMdXVvQ/exec';
    let allData = [];
      
    async function loadData() {
      try {
        const response = await fetch(API_URL, {
          method: 'GET',
          redirect: 'follow' 
        });
        
        if (!response.ok) throw new Error(`HTTP error! status: ${response.status}`);

        const result = await response.json();
        allData = result.rows;
        renderTable();
        console.log('데이터 로드 완료 (건수):', result.count);
      } catch (error) {
        document.getElementById('dataBody').innerHTML = `<tr><td colspan="8" class="loading-text" style="color:#f87171;">데이터를 불러오지 못했습니다. API URL을 확인해주세요.</td></tr>`;
        console.error('데이터 로드 실패:', error);
      }
    }
    
    // 상태 텍스트에 따라 배지 클래스를 자동으로 매핑하는 함수
    function getStatusBadge(statusText) {
      if (!statusText) return '';
      const text = statusText.toString().toLowerCase();
      if (text.includes('완료') || text.includes('completed')) return `<span class="badge badge-complete">${statusText}</span>`;
      if (text.includes('지연') || text.includes('에러')) return `<span class="badge badge-delay">${statusText}</span>`;
      if (text.includes('보류') || text.includes('waiting')) return `<span class="badge badge-hold">${statusText}</span>`;
      return `<span class="badge badge-progress">${statusText}</span>`; // 기본값 (진행중 등)
    }
    
    function renderTable() {
      const tbody = document.getElementById('dataBody');
      const headers = document.getElementById('tableHeaders');
      
      if (!allData || allData.length === 0) {
        tbody.innerHTML = `<tr><td colspan="8" class="loading-text">표시할 데이터가 없습니다.</td></tr>`;
        return;
      }
      
      // 헤더 동적 생성
      if (headers.children.length === 0) {
        const headerCells = ['#', '진행상태', '항목/내용', '단계', '대응구분', '파트', '완료예정일', '공수(MD)'];
        headerCells.forEach(h => {
          const th = document.createElement('th');
          th.textContent = h;
          headers.appendChild(th);
        });
      }
      
      // 데이터 바인딩 (구글 시트 열 인덱스 기준)
      tbody.innerHTML = allData.map((row, idx) => {
        return `<tr>
          <td>${idx + 1}</td>
          <td>${getStatusBadge(row[1])}</td>
          <td style="max-width:250px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;">${row[2] || '-'}</td>
          <td>${row[4] || '-'}</td>
          <td>${row[5] || '-'}</td>
          <td>${row[7] || '-'}</td>
          <td>${row[10] || '-'}</td>
          <td style="font-weight:600;">${row[12] || '-'}</td>
        </tr>`;
      }).join('');
      
      document.getElementById('rowCount').textContent = `Total: ${allData.length} records updated in real-time.`;
    }
    
    window.addEventListener('load', loadData);
  </script>
</body>
</html>
