<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Real-time Control Tower - Project 7</title>
  <style>
    /* Slate Dark Mode UI */
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #0f172a; color: #f8fafc; }
    .container { max-width: 1400px; margin: 0 auto; padding: 16px; }
    .header { background: #1e293b; border: 1px solid #334155; border-radius: 8px; padding: 24px; margin-bottom: 12px; }
    .header-top { display: flex; gap: 20px; flex-wrap: wrap; align-items: center; }
    .project-basic { flex: 0 0 auto; min-width: 150px; }
    .project-no { font-size: 28px; font-weight: 700; color: #f8fafc; margin-bottom: 4px; }
    .donuts-row { display: flex; gap: 20px; flex: 1; justify-content: space-around; min-width: 400px; }
    
    /* Progress Bar */
    .progress-section { margin-top: 24px; padding-top: 16px; border-top: 1px solid #334155; }
    .progress-bar { height: 16px; background: #334155; border-radius: 8px; overflow: hidden; margin: 8px 0; }
    .progress-fill { height: 100%; background: linear-gradient(90deg, #34d399, #3b82f6); width: 0%; transition: width 1.5s cubic-bezier(0.1, 0, 0.2, 1); }
    
    /* Donut Styling */
    .donut-box { text-align: center; }
    .donut-label { font-size: 13px; font-weight: 600; color: #94a3b8; margin-bottom: 10px; }
    .donut-status { font-size: 12px; font-weight: 600; margin-top: 10px; }
    .loading { opacity: 0.5; font-size: 14px; text-align: center; padding: 20px; }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <div class="header-top">
        <div class="project-basic">
          <div class="project-no">Project 7</div>
          <div style="font-size: 12px; color: #64748b;">No.7_DB1 Real-time Sync</div>
        </div>
        <div class="donuts-row" id="donuts">
          <div class="loading">시트 데이터를 가져오는 중...</div>
        </div>
      </div>

      <div class="progress-section">
        <div style="display:flex; justify-content:space-between; align-items:center;">
          <span style="font-size:14px; color:#94a3b8; font-weight:600;">Overall Project Progress</span>
          <span style="font-size:18px; font-weight:700; color:#3b82f6;" id="progressText">0%</span>
        </div>
        <div class="progress-bar">
          <div class="progress-fill" id="progressFill"></div>
        </div>
      </div>
    </div>
  </div>

  <script>
    // 현재 활성화된 API URL
    const API_URL = 'https://script.google.com/macros/s/AKfycbwp7R6Up4zcEAvM-iPlSl3haH8ONPVanzqEJk6gHPLaPiG5Cy5y6usgIGsN5ijQbk3Srg/exec';

    async function syncDashboard() {
      try {
        const response = await fetch(API_URL, { redirect: 'follow' });
        const data = await response.json();
        
        const labels = ['제작', 'FAT', 'SET-UP', 'SAT'];
        
        const donutHTML = labels.map((label, i) => {
          const comp = data.complete[i] || 0;
          const incomp = data.incomplete[i] || 0;
          const total = comp + incomp;
          const percent = total === 0 ? 0 : Math.round((comp / total) * 100);
          
          const statusText = data.status[i] || 'Waiting';
          const dashArray = `${percent}, 100`;
          
          // 🎨 텍스트 기반 상태 색상 판별 로직
          let themeColor = '#fbbf24'; // 기본 금색
          const statusLower = statusText.toLowerCase();
          
          if (statusLower.includes('completed')) {
            themeColor = '#34d399'; // 녹색
          } else if (statusLower.includes('progress')) {
            themeColor = '#3b82f6'; // 파란색
          } else if (statusLower.includes('waiting')) {
            themeColor = '#fbbf24'; // 금색
          }

          // 0%일 때 원 테두리는 어두운 회색으로 처리
          const circleColor = percent === 0 ? '#334155' : themeColor;

          return `
            <div class="donut-box">
              <div class="donut-label">${label}</div>
              <div style="position: relative; width: 85px; height: 85px; margin: 0 auto;">
                <svg viewBox="0 0 36 36" style="width: 100%; height: 100%;">
                  <path d="M18 2.0845 a 15.9155 15.9155 0 0 1 0 31.831 a 15.9155 15.9155 0 0 1 0 -31.831" fill="none" stroke="#0f172a" stroke-width="3"/>
                  <path d="M18 2.0845 a 15.9155 15.9155 0 0 1 0 31.831 a 15.9155 15.9155 0 0 1 0 -31.831" fill="none" stroke="${circleColor}" stroke-width="3.5" stroke-dasharray="${dashArray}" style="stroke-linecap: round; transition: all 1s;"/>
                </svg>
                <div style="position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); font-size: 18px; font-weight: 700; color: ${themeColor};">${percent}%</div>
              </div>
              <div class="donut-status" style="color:${themeColor}">${statusText}</div>
            </div>
          `;
        }).join('');

        document.getElementById('donuts').innerHTML = donutHTML;

        // 전체 진행률 업데이트
        const overallPercent = data.overall; 
        document.getElementById('progressFill').style.width = overallPercent;
        document.getElementById('progressText').textContent = overallPercent;

      } catch (err) {
        console.error('동기화 실패:', err);
        document.getElementById('donuts').innerHTML = '<div style="color:#ef4444">데이터 연동 에러 (API URL 확인 필요)</div>';
      }
    }

    // 화면 로드 시 실행
    window.addEventListener('load', syncDashboard);
  </script>
</body>
</html>
