  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #0f172a; color: #f8fafc; }
    .container { max-width: 1400px; margin: 0 auto; padding: 16px; }
    .tabs { display: flex; gap: 10px; margin-bottom: 20px; }
    .tab-btn { padding: 12px 24px; background: #1e293b; color: #94a3b8; border: 1px solid #334155; border-radius: 8px; cursor: pointer; font-weight: 700; font-size: 15px; transition: all 0.2s; }
    .tab-btn:hover { background: #2a3a55; color: #f8fafc; }
    .tab-btn.active { background: #3b82f6; color: #fff; border-color: #3b82f6; }
    .header { background: #1e293b; border: 1px solid #334155; border-radius: 8px; padding: 24px; margin-bottom: 16px; }
    .header-top { display: flex; gap: 20px; flex-wrap: wrap; align-items: center; }
    .project-no { font-size: 28px; font-weight: 700; color: #f8fafc; margin-bottom: 4px; }
    .donuts-row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 20px; width: 100%; flex: 1; }
    .progress-bar { height: 16px; background: #334155; border-radius: 8px; overflow: hidden; margin: 8px 0; }
    .progress-fill { height: 100%; background: linear-gradient(90deg, #34d399, #3b82f6); width: 0%; transition: width 1.5s ease-out; }
    .dashboard-tools { display: flex; gap: 16px; margin-bottom: 16px; flex-wrap: wrap; }
    .quick-links { flex: 2; background: #1e293b; border: 1px solid #334155; border-radius: 8px; padding: 20px; display: grid; grid-template-columns: repeat(auto-fit, minmax(100px, 1fr)); gap: 12px; }
    .link-btn { display: flex; flex-direction: column; align-items: center; justify-content: center; background: #0f172a; border: 1px solid #334155; border-radius: 8px; padding: 16px 8px; color: #cbd5e1; text-decoration: none; font-size: 13px; font-weight: 600; cursor: pointer; }
    .kpi-panel { flex: 1; background: #1e293b; border: 1px solid #334155; border-radius: 8px; padding: 20px; display: flex; justify-content: space-around; align-items: center; }
    .kpi-item { text-align: center; }
    .kpi-title { font-size: 12px; color: #94a3b8; font-weight: 600; margin-bottom: 8px; }
    .kpi-value { font-size: 24px; font-weight: 700; font-family: monospace; }
    .slicer-panel { background: #1e293b; border: 1px solid #334155; border-radius: 8px; padding: 20px; margin-bottom: 16px; display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px; }
    .filter-group { display: flex; flex-direction: column; gap: 8px; background: #0f172a; padding: 12px; border-radius: 6px; border: 1px solid #334155; }
    .filter-title { font-size: 12px; color: #3b82f6; font-weight: 700; text-transform: uppercase; border-bottom: 1px solid #223047; padding-bottom: 4px; margin-bottom: 4px; }
    .filter-buttons { display: flex; gap: 6px; flex-wrap: wrap; }
    .filter-btn { background: #1e293b; border: 1px solid #334155; color: #cbd5e1; padding: 4px 10px; border-radius: 4px; font-size: 11px; cursor: pointer; }
    .filter-btn.active { background: #3b82f6; border-color: #3b82f6; color: #fff; font-weight: 600; }
    .charts-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 16px; }
    .chart-card { background: #1e293b; border: 1px solid #334155; border-radius: 8px; padding: 20px; }
    .chart-title { font-size: 16px; font-weight: 600; color: #f8fafc; margin-bottom: 16px; }
    .canvas-container { position: relative; height: 320px; width: 100%; }
    #detailView { background: #1e293b; border: 1px solid #3b82f6; border-radius: 8px; padding: 20px; margin-top: 16px; display: none; }
    #detailTable { width: 100%; border-collapse: collapse; font-size: 12px; }
    #detailTable th { text-align: left; padding: 8px; background: #0f172a; border-bottom: 1px solid #334155; color: #94a3b8; font-weight: 600; }
    #detailTable td { padding: 8px; border-bottom: 1px solid #1e293b; color: #e2e8f0; }
    .badge { display: inline-block; padding: 3px 8px; border-radius: 4px; font-size: 11px; font-weight: 600; }
    @media(max-width: 1024px) { .charts-grid { grid-template-columns: 1fr; } .donuts-row { grid-template-columns: 1fr 1fr; } }
  </style>
</head>

  <script>
    const API_URL = 'https://script.google.com/macros/s/AKfycbylR_rUB-GaTh0V1XhYUfQwFwuzIIMOE0avdY4IbijTyHLPkp-_dXaaZprNVeYK_Azkvw/exec';

    let allData = {}; 
    let currentProjectId = 'project7'; 
    let csRiskData = [];
    let csStatsData = {};
    let rawData = [];
    let mdChartInstance = null;
    let statusChartInstance = null;
    let currentDates = [];
    let activeFilters = { '단계 구분': 'All', '대응 구분': 'All', '유/무상': 'All', '파트 구분': 'All', '진행상태': 'All' };

    Chart.defaults.color = '#94a3b8';
    Chart.defaults.borderColor = '#334155';

    function formatDate(dateStr) {
      if (!dateStr) return '-';
      return dateStr.toString().substring(2);
    }

    window.closeDetail = function() {
      document.getElementById('detailView').style.display = 'none';
    }
window.showDetailView = function(dateLabel, typeLabel, dataRows) {
      const detailView = document.getElementById('detailView');
      const detailTitle = document.getElementById('detailTitle');
      const detailTable = document.getElementById('detailTable');

      // 👇 거추장스러운 빨간 닫기 버튼 삭제하고 다시 깔끔한 텍스트로 원복!
      detailTitle.textContent = `${dateLabel} - [${typeLabel}] 상세 내역`;

      if (dataRows.length === 0) {
        detailTable.innerHTML = '<tr><td style="text-align:center;">데이터가 없습니다.</td></tr>';
      } else {
        const headers = ['진행상태', '업무 구분', '작업 시간', '공수(MD)', '표준 제작 Item / Issue / 개선사항', '진행 사항', '분석 데이터'];
        let html = '<tr>' + headers.map(h => `<th>${h}</th>`).join('') + '</tr>';

        dataRows.forEach(row => {
          html += '<tr>' + headers.map(h => {
            // 1. 진행상태 뱃지
            if (h === '진행상태') {
              let val = row[h] || '-';
              let color = val.includes('완료') ? '#059669' : (val.includes('지연') || val === 'Issue' ? '#dc2626' : '#3b82f6');
              return `<td style="text-align: center; vertical-align: top;"><span class="badge" style="background:${color};">${val}</span></td>`;
            }

            // 2. 작업 시간
            if (h === '작업 시간') {
              const start = row['시작 시간'] || '';
              const end = row['종료 시간'] || '';
              let val = start && end ? `${start} ~ ${end}` : (start || end || '-');
              return `<td style="text-align: center; font-size: 11px; color: #94a3b8; white-space: nowrap; vertical-align: top; padding-top: 12px;">${val}</td>`;
            }
            
            // 3. 대괄호 '[키워드]' 와 콜론 ':' 모두 인식
            if (h === '분석 데이터') {
              let val = row[h] || '-';
              if (val === '-') return `<td style="vertical-align: top; color: #cbd5e1;">-</td>`;
              
              let lines = val.split('\n');
              let blocks = [];
              let currentBlock = null;

              lines.forEach(line => {
                let trimmed = line.trim();
                if (!trimmed) return;

                const bracketMatch = trimmed.match(/^\[(.*?)\](.*)/);

                if (bracketMatch) {
                  currentBlock = { keyword: bracketMatch[1].trim(), content: bracketMatch[2].trim() };
                  blocks.push(currentBlock);
                } else if (trimmed.includes(':')) {
                  const splitIndex = trimmed.indexOf(':');
                  const keyword = trimmed.substring(0, splitIndex).trim();
                  const content = trimmed.substring(splitIndex + 1).trim();

                  currentBlock = { keyword: keyword, content: content };
                  blocks.push(currentBlock);
                } else {
                  if (currentBlock) {
                    currentBlock.content += (currentBlock.content ? '<br>' : '') + trimmed;
                  } else {
                    blocks.push({ keyword: null, content: trimmed });
                  }
                }
              });

              let formattedHtml = '';
              blocks.forEach(block => {
                if (block.keyword) {
                  formattedHtml += `
                    <div style="display: flex; flex-direction: column; align-items: flex-start; gap: 4px; margin-bottom: 12px;">
                      <span class="badge" style="background: #312e81; border: 1px solid #4f46e5; color: #c7d2fe;">
                        📌 ${block.keyword}
                      </span>
                      ${block.content ? `<span style="color: #cbd5e1; line-height: 1.5;">${block.content}</span>` : ''}
                    </div>`;
                } else {
                  formattedHtml += `<div style="color: #cbd5e1; line-height: 1.5; margin-bottom: 12px;">${block.content}</div>`;
                }
              });

              return `<td style="min-width: 250px; max-width: 400px; white-space: normal; word-break: keep-all; overflow-wrap: break-word; vertical-align: top;">${formattedHtml}</td>`;
            }

            // 4. 표준 제작 Item 및 진행 사항 열 줄바꿈 강제 지정
            if (h === '표준 제작 Item / Issue / 개선사항' || h === '진행 사항') {
              let val = row[h] || '-';
              return `<td style="min-width: 200px; max-width: 350px; white-space: pre-wrap; word-break: keep-all; overflow-wrap: break-word; line-height: 1.5; vertical-align: top; color: #e2e8f0;">${val}</td>`;
            }
            
            // 5. 정렬 디테일
            if (h === '공수(MD)' || h === '업무 구분') {
              let val = row[h] || '-';
              return `<td style="text-align: center; vertical-align: top;">${val}</td>`;
            }
            
            let val = row[h] || '-';
            return `<td style="vertical-align: top;">${val}</td>`;
          }).join('') + '</tr>';
        });
        detailTable.innerHTML = html;
      }
      detailView.style.display = 'block';
      detailView.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
    }

    window.toggleSection = function(section) {
      const content = document.getElementById(section + 'Content');
      if (content) {
        content.style.display = content.style.display === 'none' ? 'block' : 'none';
      }
    }

    async function syncDashboard() {
      try {
        const response = await fetch(API_URL, { redirect: 'follow' });
        allData = await response.json();
        
        if (allData.project1CsRiskMap) {
          csRiskData = allData.project1CsRiskMap;
        }
        
        if (allData.csStatistics) {
          csStatsData = allData.csStatistics;
          renderTotalStats();
        }
        
        window.switchProject('project7');
      } catch (err) {
        console.error('동기화 실패:', err);
      }
    }

    window.switchProject = function(projectId) {
      currentProjectId = projectId;
      
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      document.getElementById(`btn-${projectId}`).className = 'tab-btn active';
      
      const titleMap = { 'project7': 'Project 7', 'project6': 'Project 6', 'project3': 'Project 3' };
      document.getElementById('projectTitle').textContent = titleMap[projectId] || 'Project';

      activeFilters = { '단계 구분': 'All', '대응 구분': 'All', '유/무상': 'All', '파트 구분': 'All', '진행상태': 'All' };
      
      if(allData[projectId]) {
        rawData = allData[projectId].history || [];

    function renderDonuts(summaryData) {
      const labels = ['제작', 'FAT', 'SET-UP', 'SAT'];
      const donutHTML = labels.map((label, i) => {
        const comp = summaryData.complete[i] || 0;
        const incomp = summaryData.incomplete[i] || 0;
        const total = comp + incomp;
        const percent = total === 0 ? 0 : Math.round((comp / total) * 100);
        const statusText = summaryData.status[i] || 'Waiting';
        let themeColor = '#fbbf24';
        if (statusText.toLowerCase().includes('completed')) themeColor = '#34d399';
        else if (statusText.toLowerCase().includes('progress')) themeColor = '#3b82f6';
        return `<div style="text-align: center;"><div style="font-size: 13px; color: #94a3b8; margin-bottom: 10px;">${label}</div><div style="position:relative;width:90px;height:90px;margin:0 auto;"><svg viewBox="0 0 36 36" style="width:100%;height:100%;"><circle cx="18" cy="18" r="15.9155" fill="none" stroke="#0f172a" stroke-width="3"/><circle cx="18" cy="18" r="15.9155" fill="none" stroke="${themeColor}" stroke-width="3.5" stroke-dasharray="${percent}, 100" style="stroke-linecap:round;"/></svg><div style="position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);font-size:19px;font-weight:700;color:${themeColor};">${percent}%</div></div><div style="margin-top: 12px; color:${themeColor}; font-weight: 700;">${statusText}</div></div>`;
      }).join('');
      document.getElementById('donuts').innerHTML = donutHTML;
      document.getElementById('progressFill').style.width = summaryData.overall || '0%';
      document.getElementById('progressText').textContent = summaryData.overall || '0%';
    }

    function renderSlicers() {
      const container = document.getElementById('slicers');
      container.innerHTML = '';
      const filterCategories = ['단계 구분', '대응 구분', '유/무상', '파트 구분', '진행상태'];
      filterCategories.forEach(category => {
        const uniqueValues = [...new Set(rawData.map(row => row[category]).filter(val => val && val.trim() !== ''))];
        if (uniqueValues.length === 0) return;
        const groupDiv = document.createElement('div');
        groupDiv.className = 'filter-group';
        let buttonsHTML = `<button class="filter-btn ${activeFilters[category] === 'All' ? 'active' : ''}" onclick="window.applyFilter('${category}', 'All')">All</button>`;
        uniqueValues.forEach(val => {
          buttonsHTML += `<button class="filter-btn ${activeFilters[category] === val ? 'active' : ''}" onclick="window.applyFilter('${category}', '${val}')">${val}</button>`;
        });
        groupDiv.innerHTML = `<div class="filter-title">${category}</div><div class="filter-buttons">${buttonsHTML}</div>`;
        container.appendChild(groupDiv);
      });
    }

    window.applyFilter = function(category, value) {
      activeFilters[category] = value;
      renderSlicers();
      updateCharts();
      window.closeDetail();
    }

function updateCharts() {
      let filteredData = rawData.filter(row => {
        for (let cat in activeFilters) {
          if (activeFilters[cat] !== 'All' && row[cat] !== activeFilters[cat]) return false;

      });

      let sumMD = 0, countIssue = 0, countIncomplete = 0;

      });

          datasets: statusTypes.map(type => ({
            label: type,

    function renderCsBubbleChart() {
      const canvas = document.getElementById('csBubbleCanvas');
      if (!canvas) return;
      
      const ctx = canvas.getContext('2d');
      const rect = canvas.getBoundingClientRect();
      canvas.width = rect.width;
      canvas.height = rect.height;

      const padding = 80;
      const graphWidth = canvas.width - padding * 2;
      const graphHeight = canvas.height - padding * 2;

      ctx.fillStyle = '#0f172a';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      if (csRiskData.length === 0) {
        ctx.fillStyle = '#64748b';
        ctx.font = '14px sans-serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText('데이터 없음', canvas.width / 2, canvas.height / 2);
        return;
      }

let maxX = Math.max(...csRiskData.map(p => p.x), 2) * 1.2;
let maxY = Math.max(...csRiskData.map(p => p.y), 2) * 1.2;

      // 디버그 확인용
console.log('maxX:', maxX, 'maxY:', maxY);

      ctx.strokeStyle = '#334155';
      ctx.lineWidth = 1;
      for (let i = 0; i <= 5; i++) {
        const x = padding + (graphWidth / 5) * i;
        const y = padding + (graphHeight / 5) * i;
        ctx.beginPath();
        ctx.moveTo(x, padding);
        ctx.lineTo(x, canvas.height - padding);
        ctx.stroke();
        ctx.beginPath();
        ctx.moveTo(padding, y);
        ctx.lineTo(canvas.width - padding, y);
        ctx.stroke();
      }

      ctx.strokeStyle = '#64748b';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(padding, canvas.height - padding);
      ctx.lineTo(canvas.width - padding, canvas.height - padding);
      ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(padding, padding);
      ctx.lineTo(padding, canvas.height - padding);
      ctx.stroke();
            // X축/Y축 레이블
      ctx.fillStyle = '#94a3b8';
      ctx.font = '12px sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'top';
      ctx.fillText('임박 수준 →', canvas.width / 2, canvas.height - 20);
      
      ctx.save();
      ctx.translate(20, canvas.height / 2);
      ctx.rotate(-Math.PI / 2);
      ctx.textAlign = 'center';
      ctx.fillText('← 지연 수준', 0, 0);
      ctx.restore();
      // X축 숫자 (동적)
      ctx.font = '11px sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'top';
      ctx.fillStyle = '#94a3b8';
      for (let i = 0; i <= 5; i++) {
        const value = (maxX / 5) * i;  // ← 추가
        const x = padding + (graphWidth / 5) * i;
        ctx.fillText(value.toFixed(1), x, canvas.height - padding + 20);  // i → value로 변경
      }
      
      // Y축 숫자 (동적)
      ctx.textAlign = 'right';
      ctx.textBaseline = 'middle';
      for (let i = 0; i <= 5; i++) {
        const value = (maxY / 5) * i;  // ← 이 줄 추가!
        const y = canvas.height - padding - (graphHeight / 5) * i;
        ctx.fillText(value.toFixed(1), padding - 15, y);  // i → value로 변경
      }

const colorMap = { '안정': '#86EFAC', '임박': '#FCD34D', '주의': '#F9A8D4', '위험': '#FCA5A5', '심각': '#EF4444' };

// 같은 좌표 그룹화 ← 추가!
const grouped = {};
csRiskData.forEach((project, idx) => {
  const key = `${project.x.toFixed(2)},${project.y.toFixed(2)}`;
  if (!grouped[key]) grouped[key] = [];
  grouped[key].push({ ...project, originalIndex: idx });
});

csRiskData.forEach((project, index) => {
        let x = padding + (project.x / maxX) * graphWidth;
        let y = canvas.height - padding - (project.y / maxY) * graphHeight;
const radius = (project.size / 100) * 20 + 15;

        // 대각선 배치 ← 추가!
        const key = `${project.x.toFixed(2)},${project.y.toFixed(2)}`;
        const groupIndex = grouped[key].findIndex(p => p.originalIndex === index);
        const groupSize = grouped[key].length;

        if (groupSize > 1) {
          const spacing = window.bubbleSpacing || 50;
          x += groupIndex * spacing;
          y -= groupIndex * spacing;
        }

        let color = colorMap[project.status] || '#86EFAC';

        ctx.fillStyle = color;
        ctx.globalAlpha = 0.7;
        ctx.beginPath();
        ctx.arc(x, y, radius, 0, Math.PI * 2);
        ctx.fill();
        ctx.globalAlpha = 1;

        ctx.strokeStyle = color;
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.arc(x, y, radius, 0, Math.PI * 2);
        ctx.stroke();

        ctx.fillStyle = '#f8fafc';
        ctx.font = 'bold 13px monospace';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(project.name, x, y);

        project.x_pixel = x;
        project.y_pixel = y;
        project.radius = radius;
      });

      canvas.onclick = (e) => {
        const rect = canvas.getBoundingClientRect();
        const mouseX = e.clientX - rect.left;
        const mouseY = e.clientY - rect.top;

        csRiskData.forEach(project => {
          const dist = Math.sqrt(Math.pow(mouseX - project.x_pixel, 2) + Math.pow(mouseY - project.y_pixel, 2));
          if (dist < project.radius) {
            selectCsProject(project);
          }
        });
      };
    }

    function selectCsProject(project) {
      const html = `
        <div style="margin-bottom: 16px; padding-bottom: 12px; border-bottom: 1px solid #334155;">
          <div style="font-size: 11px; color: #94a3b8; font-weight: 600; text-transform: uppercase; margin-bottom: 4px;">프로젝트명</div>
          <div style="font-size: 18px; font-weight: 700; color: #f8fafc; font-family: monospace;">${project.name}</div>
        </div>
        <div style="margin-bottom: 16px; padding-bottom: 12px; border-bottom: 1px solid #334155;">
          <div style="font-size: 11px; color: #94a3b8; font-weight: 600; text-transform: uppercase; margin-bottom: 4px;">상태</div>
          <div style="font-size: 18px; font-weight: 700; color: #f8fafc;">${project.status}</div>

<div style="margin-bottom: 20px;">
      <div style="font-size: 11px; color: #94a3b8; font-weight: 600; text-transform: uppercase; margin-bottom: 4px;">정보</div>

    </div>
      `;

    }

function renderTotalStats() {

    const dateObj = new Date(date);
    const dayNames = ['일', '월', '화', '수', '목', '금', '토'];
    const dayLabel = date.substring(2).replace(/-/g, '.') + ` (${dayNames[dateObj.getDay()]})`;

    html += `
      <div style="margin-bottom:24px;">
        <!-- 날짜 헤더 -->
        <div style="display:flex; align-items:center; gap:12px; margin-bottom:10px;">
          <div style="font-size:15px; font-weight:700; color:#3b82f6; white-space:nowrap;">${dayLabel}</div>
          <div style="font-size:12px; color:#64748b;">${rows.length}건</div>
          <div style="font-size:12px; color:#94a3b8; background:#0f172a; padding:2px 10px; border-radius:10px; border:1px solid #334155; white-space:nowrap;">${dayMD.toFixed(1)} MD</div>
          <div style="flex:1; height:1px; background:#334155;"></div>
        </div>
        <!-- 카드 목록 -->
        <div style="display:flex; flex-direction:column; gap:8px;">
    `;

rows.forEach(row => {
  const sColor = statusColor[row['진행상태']] || '#334155';
  const tColor = taskColor[row['업무구분']] || '#374151';
  const stColor = stageBadge[row['단계']] || '#1e293b';

  function parseAnalysis(val) {
    if (!val || val.trim() === '' || val === '-') return '';
    let lines = val.split('\n');
    let blocks = [];
    let currentBlock = null;
    lines.forEach(line => {
      let trimmed = line.trim();
      if (!trimmed) return;
      const bracketMatch = trimmed.match(/^\[(.*?)\](.*)/);
      if (bracketMatch) {
        currentBlock = { keyword: bracketMatch[1].trim(), content: bracketMatch[2].trim() };
        blocks.push(currentBlock);
      } else if (trimmed.includes(':') && !currentBlock) {
        const splitIndex = trimmed.indexOf(':');
        currentBlock = { keyword: trimmed.substring(0, splitIndex).trim(), content: trimmed.substring(splitIndex + 1).trim() };
        blocks.push(currentBlock);
      } else {
        if (currentBlock) currentBlock.content += (currentBlock.content ? '<br>' : '') + trimmed;
        else blocks.push({ keyword: null, content: trimmed });
      }
    });
    let html = '';
    blocks.forEach((block, i) => {
      if (i > 0) html += `<div style="height:0.5px; background:#1e293b; margin:8px 0;"></div>`;
      if (block.keyword) {
        html += `
          <div>
            <span style="display:inline-flex; align-items:center; gap:5px; background:#312e81; border:1px solid #4f46e5; color:#c7d2fe; font-size:11px; font-weight:600; padding:2px 10px; border-radius:4px; margin-bottom:5px;">
              📌 ${block.keyword}
            </span>
            ${block.content ? `<div style="font-size:12px; color:#cbd5e1; line-height:1.6;">${block.content}</div>` : ''}
          </div>`;
      } else {
        html += `<div style="font-size:12px; color:#cbd5e1; line-height:1.6;">${block.content}</div>`;
      }
    });
    return html;
  }

  const analysisHtml = parseAnalysis(row['분석'] || '');
  const hasAnalysis = analysisHtml !== '';
  const hasDesc = row['설명'] && row['설명'].trim();
  const hasDetail = hasDesc || hasAnalysis;

  html += `
    <div style="background:#0f172a; border:1px solid ${hasAnalysis ? '#4f46e5' : '#1e293b'}; border-radius:6px; padding:12px 16px; display:grid; grid-template-columns:100px 1fr; gap:12px; align-items:start;">

      <!-- 좌: 시간 + 공수 + 프로젝트 -->
      <div style="display:flex; flex-direction:column; gap:6px;">
        <div style="font-size:11px; color:#475569; font-family:monospace; white-space:nowrap;">${row['시간'] || '-'}</div>
        ${row['공수'] ? `<div style="font-size:12px; font-weight:700; color:#94a3b8;">${row['공수'].toFixed(1)} MD</div>` : ''}
        ${row['프로젝트'] ? `<span style="background:#0f2744; color:#60a5fa; font-size:11px; font-weight:700; padding:2px 8px; border-radius:4px; border:1px solid #1d4ed8; text-align:center;">${row['프로젝트']}</span>` : ''}
      </div>

      <!-- 우: 뱃지 + 제목 + 상세박스 -->
      <div>
        <div style="display:flex; gap:6px; flex-wrap:wrap; margin-bottom:6px;">
          <span style="background:${sColor}; color:#fff; font-size:10px; font-weight:700; padding:2px 8px; border-radius:4px;">${row['진행상태'] || '-'}</span>
          <span style="background:${tColor}; color:#e2e8f0; font-size:10px; font-weight:700; padding:2px 8px; border-radius:4px;">${row['업무구분'] || '-'}</span>
          ${row['단계'] ? `<span style="background:${stColor}; color:#94a3b8; font-size:10px; font-weight:600; padding:2px 8px; border-radius:4px;">${row['단계']}</span>` : ''}
          ${row['유무상'] ? `<span style="background:${row['유무상']==='유상'?'#1e3a5f':'#1e293b'}; color:${row['유무상']==='유상'?'#93c5fd':'#64748b'}; font-size:10px; font-weight:600; padding:2px 8px; border-radius:4px; border:1px solid ${row['유무상']==='유상'?'#1d4ed8':'#334155'};">${row['유무상']}</span>` : ''}
        </div>

        <div style="font-size:13px; color:#f1f5f9; font-weight:600; margin-bottom:${hasDetail ? '8px' : '0'}; line-height:1.4;">${row['제목'] || '-'}</div>

        ${hasDetail ? `
        <div style="background:#0a0f1a; border:1px solid #1e293b; border-radius:6px; padding:10px 14px;">
          ${hasDesc ? `
            <div style="font-size:11px; color:#3b82f6; font-weight:700; text-transform:uppercase; letter-spacing:0.04em; margin-bottom:4px;">진행 사항</div>
            <div style="font-size:12px; color:#94a3b8; line-height:1.6; white-space:pre-wrap; margin-bottom:${hasAnalysis ? '10px' : '0'};">${row['설명']}</div>
          ` : ''}
          ${hasDesc && hasAnalysis ? `<div style="height:0.5px; background:#1e293b; margin-bottom:10px;"></div>` : ''}
          ${hasAnalysis ? `
            <div style="font-size:11px; color:#8b5cf6; font-weight:700; text-transform:uppercase; letter-spacing:0.04em; margin-bottom:8px;">분석 데이터</div>
            ${analysisHtml}
          ` : ''}
        </div>
        ` : ''}
      </div>
    </div>
  `;
});

    html += `</div></div>`;
  });

  content.innerHTML = html;
}

    window.bubbleSpacing = 50;
    document.addEventListener('DOMContentLoaded', () => {
      const slider = document.getElementById('spacingSlider');
      if (slider) {
        slider.addEventListener('input', (e) => {
          window.bubbleSpacing = parseInt(e.target.value);
          document.getElementById('spacingValue').textContent = window.bubbleSpacing;
          renderCsBubbleChart();
        });
      }
    });

    window.addEventListener('load', syncDashboard);
    window.runAIAnalysis = async function(modelType) {
      const btnFlash = document.getElementById('ai-btn-flash');
      const btnPro = document.getElementById('ai-btn-pro');
      const resultBox = document.getElementById('ai-result');

      const isPro = modelType === 'pro';
      const activeBtn = isPro ? btnPro : btnFlash;
      const inactiveBtn = isPro ? btnFlash : btnPro;
      const originalText = activeBtn.innerHTML;

      activeBtn.innerHTML = '분석 중... ⏳';
      activeBtn.disabled = true;
      inactiveBtn.disabled = true;
      inactiveBtn.style.opacity = '0.5';

      resultBox.style.display = 'block';
      resultBox.innerHTML = `<span style="color: ${isPro ? '#a78bfa' : '#34d399'}; font-weight: bold;">Gemini 1.5 ${isPro ? 'Pro' : 'Flash'} 모델이 상세 데이터를 긁어 분석하고 있습니다...</span>`;

      try {
        const tableData = Array.from(document.querySelectorAll('#detailTable tr')).map(row => row.innerText);
        const projectName = document.getElementById('projectTitle').textContent;

        const payload = {
          projectTitle: projectName,
          modelType: modelType, 
          historyData: tableData.length > 1 ? tableData : ["현재 선택된 세부 공정 데이터가 없습니다."]
        };

        const response = await fetch('/api/gemini', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });

        const data = await response.json();
        if (data.report) {
          resultBox.innerHTML = data.report;
        } else {
          resultBox.innerHTML = `<span style="color: #ef4444;">분석 오류: ${data.error}</span>`;
        }
      } catch (error) {
        resultBox.innerHTML = `<span style="color: #ef4444;">통신 실패: Vercel 서버 연결을 확인하세요.</span>`;
      } finally {
        activeBtn.innerHTML = originalText;
        activeBtn.disabled = false;
        inactiveBtn.disabled = false;
        inactiveBtn.style.opacity = '1';
      }
    }
  </script>
</body>
</html>
