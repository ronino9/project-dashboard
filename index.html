<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>Control Tower - Project 7</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    body { background: #0f172a; color: #f8fafc; font-family: sans-serif; }
    .container { max-width: 1400px; margin: 0 auto; padding: 20px; }
    
    /* 대시보드 도구들 */
    .dashboard-tools { display: flex; gap: 16px; margin-bottom: 16px; flex-wrap: wrap; }
    .quick-links { flex: 2; background: #1e293b; border: 1px solid #334155; border-radius: 8px; padding: 20px; display: grid; grid-template-columns: repeat(6, 1fr); gap: 12px; }
    .kpi-panel { flex: 1; background: #1e293b; border: 1px solid #334155; border-radius: 8px; padding: 20px; display: flex; justify-content: space-around; align-items: center; }
    
    /* 슬라이서 */
    .slicer-panel { background: #1e293b; border: 1px solid #334155; border-radius: 8px; padding: 20px; margin-bottom: 16px; display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px; }
    .filter-btn { background: #1e293b; border: 1px solid #334155; color: #cbd5e1; padding: 4px 10px; border-radius: 4px; font-size: 11px; cursor: pointer; }
    .filter-btn.active { background: #3b82f6; border: 1px solid #3b82f6; color: #fff; }

    /* 차트 및 상세창 */
    .charts-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-top: 20px; }
    .chart-card { background: #1e293b; padding: 20px; border-radius: 8px; height: 350px; }
    #detailView { margin-top: 20px; background: #1e293b; padding: 20px; border-radius: 8px; display: none; }
    table { width: 100%; border-collapse: collapse; margin-top: 10px; color: #fff; }
    th, td { padding: 12px; border-bottom: 1px solid #334155; text-align: left; font-size: 13px; }
  </style>
</head>
<body>
  <div class="container">
    <div class="dashboard-tools">
      <div class="quick-links">
        <a href="#" class="filter-btn">Works</a><a href="#" class="filter-btn">PMO</a>
        <a href="#" class="filter-btn">통합관리</a><a href="#" class="filter-btn">Data Base</a>
        <a href="#" class="filter-btn">Master Plan</a><a href="#" class="filter-btn">상세이력</a>
      </div>
      <div class="kpi-panel">
        <div>공수 합계<div style="font-size:20px; font-weight:700;" id="kpi-md">0.0</div></div>
        <div>ISSUE 합계<div style="font-size:20px; font-weight:700; color:#ef4444;" id="kpi-issue">0</div></div>
        <div>미완료 합계<div style="font-size:20px; font-weight:700; color:#f59e0b;" id="kpi-incomp">0</div></div>
      </div>
    </div>
    
    <div class="slicer-panel" id="slicers"></div>

    <div class="charts-grid">
      <div class="chart-card"><canvas id="mdChart"></canvas></div>
      <div class="chart-card"><canvas id="statusChart"></canvas></div>
    </div>
    
    <div id="detailView">
      <div id="detailHeader" style="font-weight:700; color:#3b82f6; margin-bottom:10px;"></div>
      <table id="detailTable"></table>
    </div>
  </div>

  <script>
    const API_URL = 'https://script.google.com/macros/s/AKfycbwwCFRGw4cpFOtPZITa1kt6P2cO92TIG-UZcv3CXu9igPeaGHkwTm4hcp_iEer5O1edPQ/exec';
    let rawData = []; let mdChartInstance, statusChartInstance;
    let activeFilters = {'단계 구분':'All','대응 구분':'All','진행상태':'All'};

    // 1. 상세 보기 함수 (클릭시 호출)
    function showDetail(date, category, isMd) {
      const filtered = rawData.filter(r => {
        const d = (r['접수일'] || r['완료예정일']);
        // 날짜가 같고, 카테고리(업무구분 or 상태)가 같은 것만 필터링
        return d && d.substring(2) === date && (isMd ? r['업무 구분'] === category : r['진행상태'] === category);
      });
      
      document.getElementById('detailView').style.display = filtered.length ? 'block' : 'none';
      document.getElementById('detailHeader').textContent = `[ ${date} / ${category} 상세 리스트 ]`;
      document.getElementById('detailTable').innerHTML = '<tr><th>내용</th><th>공수</th><th>상태</th></tr>' + 
        filtered.map(r => `<tr><td>${r['내용']||'-'}</td><td>${r['공수(MD)']||'-'}</td><td>${r['진행상태']||'-'}</td></tr>`).join('');
    }

        values.forEach(v => {
